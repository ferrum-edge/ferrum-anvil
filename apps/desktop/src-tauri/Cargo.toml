[package]
name = "anvil-desktop"
description = "Ferrum Anvil desktop shell (Tauri 2). All network activity and secret handling happen in Rust; the webview only renders redacted results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "anvil_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anvil-domain.workspace = true
anvil-app.workspace = true
anvil-engine.workspace = true
anvil-storage.workspace = true
anvil-portability.workspace = true
anvil-transport.workspace = true
anvil-auth.workspace = true
anvil-diagnostics.workspace = true
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
chrono.workspace = true
zeroize.workspace = true
base64.workspace = true

[features]
# Test-only: embedded WebDriver for native E2E. Never enabled in release builds
# (the release check verifies the binary contains no WebDriver server).
e2e = ["dep:tauri-plugin-wdio-webdriver"]
