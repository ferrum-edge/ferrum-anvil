# Ferrum Anvil failure lab - profile "cpdp", CONTROL PLANE process (ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5. GW-005 (config_stale) with a real CP.
# Start:    ferrum-edge run      -m cp -s <rendered cpdp-cp.conf>
# Validate: ferrum-edge validate -m cp -s <rendered cpdp-cp.conf>
#
# A CP ALWAYS needs a database (FERRUM_DB_TYPE/FERRUM_DB_URL are required in cp mode,
# src/config/env_config.rs:6897-6905); there is no file-backed CP config source. SQLite keeps
# it local. Resources are created through the CP Admin API (see cpdp-seed-proxy.json and
# docs/audit/gateway-lab-config.md), not from a YAML file.
#
# Required ENVIRONMENT (generated per run by the lab runner, never written here):
#   FERRUM_ADMIN_JWT_SECRET       >= 32 chars (CP admin writes need an HS256 admin JWT)
#   FERRUM_CP_DP_GRPC_JWT_SECRET  >= 32 chars, must DIFFER from the admin secret, and must be
#                                 identical on the DP
# {{LAB_RUN}} = absolute per-run scratch directory (filled by the lab runner).

FERRUM_MODE = cp
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_DB_TYPE = sqlite
FERRUM_DB_URL = "sqlite:{{LAB_RUN}}/cpdp-cp.db?mode=rwc"
FERRUM_DB_POLL_INTERVAL = 1

# Loopback plaintext gRPC is always permitted; the default 0.0.0.0:50051 plaintext bind is
# refused at startup, so this must be set.
FERRUM_CP_GRPC_LISTEN_ADDR = 127.0.0.1:18795

FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18790
FERRUM_ADMIN_HTTPS_PORT = 0

FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
