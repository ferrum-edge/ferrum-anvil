# Ferrum Anvil failure lab - profile "auth" (gateway settings, ferrum.conf format)
# Target binary: ferrum-edge v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered auth.conf> -c <rendered auth.yaml>
# Validate: ferrum-edge validate -m file -s <rendered auth.conf> -c <rendered auth.yaml>
#
# Required ENVIRONMENT (not written here; generated per run by the lab runner):
#   FERRUM_BASIC_AUTH_HMAC_SECRET  >= 32 bytes; basic_auth fails to build without it
#                                  (src/plugins/basic_auth.rs:95-101). auth.yaml's
#                                  {{BASIC_AUTH_ALICE_HASH}} must be computed from it:
#                                  hex(HMAC-SHA256(key=secret, msg=password))
#                                  (src/config/types.rs:9009-9031).
#   FERRUM_ADMIN_JWT_SECRET        optional in file mode (>= 32 chars if set).
# The identity-provider fixtures (127.0.0.1:19102: JWKS, introspection, token endpoint;
# 127.0.0.1:19103: JWKS for the outage scenario) and the LDAP fixture (127.0.0.1:19106)
# must be up before the gateway starts: a JWKS store that has never loaded keeps /health
# at ready:false.
# 127.0.0.1:19104 and 127.0.0.1:19107 are deliberately unbound (dependency outage stimuli).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18180
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18190
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
