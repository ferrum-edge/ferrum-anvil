# Ferrum Anvil failure lab - profile "admission", mesh instance (ferrum.conf format)
# Target binary: ferrum-edge v0.9.5 (ferrum-edge-macos-aarch64), MESH mode, localized file config.
# Start:    ferrum-edge run      -m mesh -s <rendered admission-mesh.conf> -c <rendered admission-mesh.json>
# Validate: ferrum-edge validate -m mesh -s <rendered admission-mesh.conf> -c <rendered admission-mesh.json>
#
# Why a mesh instance: the only carrier of a per-destination physical-connection ceiling in
# 0.9.5 is DestinationRule connectionPool.tcp.maxConnections (Upstream.port_overrides[].
# max_connections), which file mode rejects and only the mesh slice-apply layer projects
# (UP-018). The egress-gateway topology materializes host-routed HTTP proxies from
# mesh_external ServiceEntries behind an SVID-mTLS listener, so Anvil can drive it directly.
#
# Mesh document admission-mesh.json (JSON: the localized source admits only `version` + `mesh`,
# so its notes live here). One mesh_external ServiceEntry, localhost:19503 (http), capped at ONE
# physical backend connection by a DestinationRule (maxConnections): the reqwest HTTP/1.1 lane
# answers 503 backend_error {"error":"Backend connection limit exceeded"}
# (catalog upstream.connection_limit.reqwest). The backend must be strictly HTTP/1.1: an h2c-capable
# backend lets the startup capability probe keep a pooled connection that occupies the only slot.
# The pooled lanes (direct H2 / gRPC / H3) could not be driven into the ceiling here - see
# docs/lab/policy-admission.md (UP-018-H2 skip).
# DNS resolution on purpose: v0.9.5 attaches a DestinationRule by matching its host against the
# upstream TARGET host, and a STATIC ServiceEntry's target is its endpoint IP, so a static entry
# would silently never receive the cap (live-checked).
#
# Tokens rendered by crates/anvil-lab/src/admission.rs:
#   {{MESH_PKI}}  directory with ca.pem, egress.pem/.key (generated per run, never committed)
#   {{LAB_RUN}}   this instance's run directory (holds the rendered admission-mesh.json)
# Every listener binds 127.0.0.1 inside the admission port block (18580-18599).

FERRUM_MODE = mesh
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_MESH_TOPOLOGY = egress_gateway
FERRUM_MESH_CONFIG_PROTOCOL = file
FERRUM_MESH_FILE_CONFIG_PATH = "{{LAB_RUN}}/admission-mesh.json"
FERRUM_MESH_WORKLOAD_SPIFFE_ID = spiffe://cluster.local/ns/ferrum/sa/anvil-lab-egress
FERRUM_GATEWAY_SVID_CERT_PATH = "{{MESH_PKI}}/egress.pem"
FERRUM_GATEWAY_SVID_KEY_PATH = "{{MESH_PKI}}/egress.key"
FERRUM_GATEWAY_SVID_TRUST_BUNDLE_PATH = "{{MESH_PKI}}/ca.pem"

# Egress mTLS listener (the one Anvil drives) plus the topology's other listeners, all loopback.
FERRUM_MESH_EGRESS_LISTEN_ADDR = 127.0.0.1:18589
FERRUM_MESH_INBOUND_LISTEN_ADDR = 127.0.0.1:18586
FERRUM_MESH_OUTBOUND_LISTEN_ADDR = 127.0.0.1:18581
FERRUM_MESH_HBONE_LISTEN_ADDR = 127.0.0.1:18588
FERRUM_MESH_DNS_PROXY_ENABLED = false
FERRUM_MESH_FEDERATION_POLL_INTERVAL_SECONDS = 0

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 0
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18592
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
