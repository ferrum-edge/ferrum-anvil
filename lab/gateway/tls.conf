# Ferrum Anvil failure lab - profile "tls" (gateway settings, ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered tls.conf> -c <rendered tls.yaml>
# Validate: ferrum-edge validate -m file -s <rendered tls.conf> -c <rendered tls.yaml>
# {{LAB_CERTS}} is replaced with an absolute path by the lab runner (no env
# substitution exists in ferrum.conf or file-mode YAML). The certificates are
# generated fresh for every run (anvil_fixtures::gateway_pki) under lab/.run/,
# never committed and never trusted outside the lab.
#
# IMPORTANT: FERRUM_FRONTEND_TLS_CLIENT_CA_BUNDLE_PATH makes a client certificate
# MANDATORY on every TLS frontend of this instance (HTTPS, HTTP/3, TCP+TLS);
# there is no optional mode (src/tls/mod.rs:1341-1366). FERRUM_DTLS_CLIENT_CA_CERT_PATH
# does the same for DTLS frontends (src/dtls/mod.rs:3284-3290). Backend-TLS scenarios
# therefore use the plaintext listener 18380.
#
# A second instance (tls.tls12.conf / tls.tls12.yaml, HTTPS 18344, admin 18391) pins
# TLS 1.2 for the TLS-1.2 client-certificate and version-mismatch scenarios.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18380
FERRUM_PROXY_HTTPS_PORT = 18343
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18390
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

# Frontend TLS + required client certificates (TLS-005 / TLS-006 / TLS-008).
FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/gateway-server.pem"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/gateway-server.key"
FERRUM_FRONTEND_TLS_CLIENT_CA_BUNDLE_PATH = "{{LAB_CERTS}}/client-ca.pem"
FERRUM_FRONTEND_TLS_HANDSHAKE_TIMEOUT_SECONDS = 5
FERRUM_TLS_MIN_VERSION = 1.2
FERRUM_TLS_MAX_VERSION = 1.3

# Frontend DTLS + required client certificates (PROTO-022 wrong-identity leg).
# ECDSA P-256/P-384 only.
FERRUM_DTLS_CERT_PATH = "{{LAB_CERTS}}/gateway-server.pem"
FERRUM_DTLS_KEY_PATH = "{{LAB_CERTS}}/gateway-server.key"
FERRUM_DTLS_CLIENT_CA_CERT_PATH = "{{LAB_CERTS}}/client-ca.pem"

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
