# Ferrum Anvil failure lab - profile "workload", MESH instances serving the SPIFFE Workload API
# Target binaries: ferrum-edge v0.9.7 (lab/gateway/RELEASE.lock) and v0.9.5, MESH mode, localized file config.
# Rendered twice by crates/anvil-lab/src/workload.rs:
#   workload-mesh     inbound 127.0.0.1:17406, admin 17490: the Workload API maps Anvil's uid to
#                     spiffe://anvil.lab/ns/lab/sa/anvil-client; its sidecar inbound listener fronts the
#                     echo workload on 127.0.0.1:17501 (STRICT mTLS).
#   workload-foreign  inbound 127.0.0.1:17426, admin 17492: the Workload API maps ANOTHER uid, so
#                     attestation refuses Anvil (PERMISSION_DENIED "workload attestation failed").
# Start:    ferrum-edge run      -m mesh -s <rendered workload-mesh.conf> -c <rendered workload-mesh.json>
# Validate: ferrum-edge validate -m mesh -s <rendered workload-mesh.conf> -c <rendered workload-mesh.json>
#
# Identity: FERRUM_MESH_CA_BACKEND=internal with the dev-only self-signed root (FERRUM_MESH_CA_BOOTSTRAP_DEV),
# the only backend that can serve a Workload API (docs/mesh.md "Workload API JWT-SVID"; env_config.rs
# validate: WORKLOAD_API_REQUIRES_CA_BACKEND / WORKLOAD_API_SPIRE_UNSUPPORTED). The trust domain is the one of
# FERRUM_MESH_WORKLOAD_SPIFFE_ID (anvil.lab). Refused under FERRUM_MESH_PRODUCTION_MODE=true.
#
# Set in the ENVIRONMENT by the lab runner (read with std::env::var, not from this file):
#   FERRUM_MESH_CA_BOOTSTRAP_DEV=true
#   FERRUM_MESH_JWT_SIGNING_KEY_PEM   a per-run ES256 (P-256) PKCS#8 key; the same key for both instances,
#                                     so the published kid (RFC 7638 thumbprint) and JWKS are stable per run.
#
# Tokens rendered by crates/anvil-lab/src/workload.rs:
#   {{LAB_RUN}}      this instance's run directory (holds the rendered workload-mesh.json)
#   {{SOCKET}}       the Workload API socket. Its parent directory must be owned by this user (or root),
#                    not group/world-writable unless sticky, on every component, and at most 74 bytes
#                    (listener.rs WorkloadApiSocketConfig::validate), so it may live outside the repository.
#   {{UID_RULE}}     uid:<uid>=<SPIFFE ID> (FERRUM_MESH_WORKLOAD_API_UNIX_IDENTITY_RULES; SO_PEERCRED uid)
#   {{JWT_TTL}}      JWT-SVID lifetime in seconds (clamped to [1, 3600] by the authority)
#   {{INBOUND_PORT}} {{OUTBOUND_PORT}} {{HBONE_PORT}} {{EGRESS_PORT}} {{DNS_PORT}} {{ADMIN_PORT}}
# Every listener binds 127.0.0.1 inside the gateway block 17400-17499; none uses a default 150xx port.

FERRUM_MODE = mesh
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_MESH_TOPOLOGY = sidecar
FERRUM_MESH_CONFIG_PROTOCOL = file
FERRUM_MESH_FILE_CONFIG_PATH = "{{LAB_RUN}}/workload-mesh.json"
FERRUM_MESH_WORKLOAD_SPIFFE_ID = spiffe://anvil.lab/ns/lab/sa/workload-svc
FERRUM_MESH_CA_BACKEND = internal

FERRUM_MESH_WORKLOAD_API_ENABLED = true
FERRUM_MESH_WORKLOAD_API_SOCKET_PATH = "{{SOCKET}}"
FERRUM_MESH_WORKLOAD_API_SOCKET_MODE = 0600
FERRUM_MESH_WORKLOAD_API_UNIX_IDENTITY_RULES = {{UID_RULE}}
FERRUM_MESH_JWT_SVID_TTL_SECONDS = {{JWT_TTL}}

# Inbound mTLS listener (the 15006-equivalent Anvil drives) and every other mesh listener, remapped.
FERRUM_MESH_INBOUND_LISTEN_ADDR = 127.0.0.1:{{INBOUND_PORT}}
FERRUM_MESH_OUTBOUND_LISTEN_ADDR = 127.0.0.1:{{OUTBOUND_PORT}}
FERRUM_MESH_HBONE_LISTEN_ADDR = 127.0.0.1:{{HBONE_PORT}}
FERRUM_MESH_EGRESS_LISTEN_ADDR = 127.0.0.1:{{EGRESS_PORT}}
FERRUM_MESH_DNS_PROXY_ENABLED = false
FERRUM_MESH_DNS_LISTEN_ADDR = 127.0.0.1:{{DNS_PORT}}
FERRUM_MESH_APP_PROBE_PORT = 0
FERRUM_MESH_FEDERATION_POLL_INTERVAL_SECONDS = 0

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 0
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = {{ADMIN_PORT}}
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
