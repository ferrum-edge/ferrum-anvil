# Ferrum Anvil failure lab - profile "proxyproto", untrusted-peer instance.
# Target binary: ferrum-edge v0.9.7, file mode. Run by the lab next to proxyproto.conf.
#
# Same trust list as the main instance (127.0.0.1/32), but the stream listeners bind the IPv6
# loopback ::1. Anvil connects from ::1, a loopback peer that is NOT inside
# FERRUM_TRUSTED_PROXIES, so the gateway must close the TCP connection before reading the
# PROXY header and drop every datagram before parsing the envelope
# (docs/tcp_udp_proxy.md "Trust Gating"; src/proxy/tcp_proxy.rs, datagram_client_address.rs).
# Nothing binds a non-loopback address. HTTP/admin stay on 127.0.0.1; HTTPS is disabled.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18984
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18992
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = "::1"

FERRUM_TRUSTED_PROXIES = 127.0.0.1/32

FERRUM_UDP_CLEANUP_INTERVAL_SECONDS = 1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
