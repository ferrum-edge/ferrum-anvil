# Ferrum Anvil failure lab - profile "early" (gateway settings, ferrum.conf format)
# Target binary: every supported ferrum-edge release (v0.9.7 default, v0.9.5), file mode.
# Start:    ferrum-edge run      -m file -s <rendered early.conf> -c <rendered early.yaml>
# Validate: ferrum-edge validate -m file -s <rendered early.conf> -c <rendered early.yaml>
# {{LAB_CERTS}} is filled with an absolute path by the lab runner.
#
# TLS 1.3 / QUIC 0-RTT early data (docs/lab/early.md). FERRUM_TLS_EARLY_DATA_METHODS
# lists the methods the HTTP/3 listener admits as early data (only GET here): the QUIC
# TLS config then sets max_early_data_size = u32::MAX on this non-mTLS listener with a
# stateful session cache (src/http3/server.rs build_h3_quinn_server_config), a request
# accepted before the handshake completed is early data, any other method in it gets
# 425 Too Early, and an admitted one reaches the backend with `Early-Data: 1`. The
# HTTPS (TCP) listener keeps rustls early data off in every supported release
# (src/tls/mod.rs enable_early_data), so its tickets never allow early data.
# early-off.conf is the same gateway without early data (ports 17281 / 17244 / 17291).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 17280
FERRUM_PROXY_HTTPS_PORT = 17243
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 17290
FERRUM_ADMIN_HTTPS_PORT = 0

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_ENABLE_HTTP3 = true
FERRUM_TLS_EARLY_DATA_METHODS = GET

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
