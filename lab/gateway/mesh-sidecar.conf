# Ferrum Anvil failure lab - profile "mesh", SIDECAR instances (ferrum.conf format)
# Target binary: ferrum-edge v0.9.7 (lab/gateway/RELEASE.lock), MESH mode, localized file config
# ("Localized file source (no control plane)" + "File-Based SVIDs: Two-Process Local Mesh" in docs/mesh.md).
# No Kubernetes, no control plane, no capture: Anvil dials the inbound mTLS listener directly.
# Rendered twice by crates/anvil-lab/src/mesh.rs: a STRICT instance (inbound 127.0.0.1:17606, admin 17690)
# and a PERMISSIVE instance (inbound 127.0.0.1:17626, admin 17692), each with its own run directory.
# Start:    ferrum-edge run      -m mesh -s <rendered mesh-sidecar.conf> -c <rendered mesh-sidecar.json>
# Validate: ferrum-edge validate -m mesh -s <rendered mesh-sidecar.conf> -c <rendered mesh-sidecar.json>
#
# Mesh document mesh-sidecar.json (JSON; the localized source admits only `version` + `mesh`, so its notes
# live here): the LOCAL workload spiffe://cluster.local/ns/ferrum/sa/anvil-lab-svc backs service `svc`
# on 127.0.0.1:17801 (the lab echo fixture) under a PeerAuthentication whose mode is {{MTLS_MODE}}, plus
# one MeshPolicy (AuthorizationPolicy) that DENIES the lab client identity on /denied/*. The sidecar
# materializes an inbound loopback route for `svc` and relays a bare HTTP/2 CONNECT (the HBONE wire shape)
# to the workload's declared address:port when the inbound relay destination guard admits it.
# The workload also declares udp ports 17802-17805 (lab UDP echo, silent, closing and unbound fixtures) and
# 17806-17807 (lab DTLS echo and untrusted DTLS fixtures): a CONNECT with `x-ferrum-mesh-protocol: udp` to
# one of them is relayed as [u16 length][payload] datagram records to a local UDP socket
# (src/proxy/hbone_proxy.rs handle_hbone_udp_request); DTLS records are opaque datagrams to the relay.
#
# Tokens rendered by crates/anvil-lab/src/mesh.rs:
#   {{MESH_PKI}}  directory with ca.pem, svc.pem/.key (generated per run, never committed)
#   {{LAB_RUN}}   this instance's run directory (holds the rendered mesh-sidecar.json)
#   {{MTLS_MODE}} strict | permissive, and the listener ports {{INBOUND_PORT}} {{OUTBOUND_PORT}}
#   {{HBONE_PORT}} {{EGRESS_PORT}} {{DNS_PORT}} {{ADMIN_PORT}}
# Every listener binds 127.0.0.1 inside the mesh gateway block (17600-17799); none uses a default 150xx port.

FERRUM_MODE = mesh
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_MESH_TOPOLOGY = sidecar
FERRUM_MESH_CONFIG_PROTOCOL = file
FERRUM_MESH_FILE_CONFIG_PATH = "{{LAB_RUN}}/mesh-sidecar.json"
FERRUM_MESH_WORKLOAD_SPIFFE_ID = spiffe://cluster.local/ns/ferrum/sa/anvil-lab-svc
FERRUM_GATEWAY_SVID_CERT_PATH = "{{MESH_PKI}}/svc.pem"
FERRUM_GATEWAY_SVID_KEY_PATH = "{{MESH_PKI}}/svc.key"
FERRUM_GATEWAY_SVID_TRUST_BUNDLE_PATH = "{{MESH_PKI}}/ca.pem"

# Inbound mTLS listener (the 15006-equivalent Anvil drives) and every other mesh listener, remapped.
FERRUM_MESH_INBOUND_LISTEN_ADDR = 127.0.0.1:{{INBOUND_PORT}}
FERRUM_MESH_OUTBOUND_LISTEN_ADDR = 127.0.0.1:{{OUTBOUND_PORT}}
FERRUM_MESH_HBONE_LISTEN_ADDR = 127.0.0.1:{{HBONE_PORT}}
FERRUM_MESH_EGRESS_LISTEN_ADDR = 127.0.0.1:{{EGRESS_PORT}}
FERRUM_MESH_DNS_PROXY_ENABLED = false
FERRUM_MESH_DNS_LISTEN_ADDR = 127.0.0.1:{{DNS_PORT}}
FERRUM_MESH_APP_PROBE_PORT = 0
FERRUM_MESH_FEDERATION_POLL_INTERVAL_SECONDS = 0

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 0
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = {{ADMIN_PORT}}
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
