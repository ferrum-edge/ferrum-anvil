# Ferrum Anvil failure lab - profile "cpdp", DATA PLANE process (ferrum.conf format)
# Target binary: ferrum-edge v0.9.5. GW-005 (config_stale).
# Start:    ferrum-edge run      -m dp -s <rendered cpdp-dp.conf>
# Validate: ferrum-edge validate -m dp -s <rendered cpdp-dp.conf>
#
# A DP takes its configuration ONLY from a CP over gRPC; there is no file-mode DP and the
# stale fence is installed only in dp mode (src/modes/data_plane.rs:44).
# Required ENVIRONMENT (same values as the CP where noted):
#   FERRUM_ADMIN_JWT_SECRET       required in dp mode (>= 32 chars)
#   FERRUM_CP_DP_GRPC_JWT_SECRET  identical to the CP's value
#
# Recipe: start CP, seed it, start DP, confirm /cpdp/echo -> 200 through 18780, kill the CP
# (or cut the DP->CP relay), wait > 5 s after the last applied snapshot -> new requests get
# 503 {"error":"Gateway configuration stale"} with X-Gateway-Error: config_stale
# (src/proxy/mod.rs:29874-29903). Restart the CP / heal the relay -> recovers after the next
# applied snapshot.
#
# The DP reaches the CP gRPC listener (127.0.0.1:18795) only through the lab's TCP relay on
# 127.0.0.1:19795 (crates/anvil-lab/src/fixtures_cpdp.rs), so the lab can partition the DP
# from a CP that keeps running.

FERRUM_MODE = dp
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_DP_CP_GRPC_URLS = http://127.0.0.1:19795
FERRUM_DP_CONFIG_MAX_STALE_SECONDS = 5
FERRUM_DP_CONFIG_STALE_ACTION = fail_closed

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18780
# DP mode binds HTTPS even without a certificate (src/modes/data_plane.rs:331-337): disable it.
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18791
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
