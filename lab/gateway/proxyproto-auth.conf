# Ferrum Anvil failure lab - profile "proxyproto", authenticated datagram instance.
# Target binary: ferrum-edge v0.9.7, file mode. Run by the lab next to proxyproto.conf.
#
# FERRUM_DATAGRAM_PROXY_PROTOCOL_SECRET is NOT in this file: the lab runner generates a random
# 64-character secret per run and passes it in the process environment (and to Anvil through
# an in-memory vault), so it never lands on disk or in results.
#
# With a secret configured every udp/dtls PROXY listener requires the HMAC-SHA-256 tag (TLV
# 0xE0) and the freshness record (TLV 0xE1), bound to the listener identity (receive
# protocol, canonical bind address, port). Stream listeners bind 127.0.0.1 here, so the
# identities Anvil must name are "udp 127.0.0.1:18911" and "dtls 127.0.0.1:18912".

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18982
FERRUM_PROXY_HTTPS_PORT = 18983
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18991
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_TRUSTED_PROXIES = 127.0.0.1/32

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_DTLS_CERT_PATH = "{{LAB_CERTS}}/server.crt"
FERRUM_DTLS_KEY_PATH = "{{LAB_CERTS}}/server.key"

FERRUM_UDP_CLEANUP_INTERVAL_SECONDS = 1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
