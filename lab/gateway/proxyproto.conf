# Ferrum Anvil failure lab - profile "proxyproto" (gateway settings, ferrum.conf format)
# Target binary: ferrum-edge v0.9.7 (see lab/gateway/RELEASE.lock), file mode.
# Start:    ferrum-edge run      -m file -s <rendered proxyproto.conf> -c <rendered proxyproto.yaml>
# Validate: ferrum-edge validate -m file -s <rendered proxyproto.conf> -c <rendered proxyproto.yaml>
# {{LAB_CERTS}} is filled with an absolute path by the lab runner.
#
# Inbound PROXY protocol (docs/tcp_udp_proxy.md "Inbound PROXY Protocol" and "Datagram
# Client-Address Metadata"): every stream proxy in proxyproto.yaml sets
# stream_proxy_protocol: true. The forwarded address is honoured only when the socket peer
# is inside FERRUM_TRUSTED_PROXIES; anything else is closed (TCP) or dropped (UDP/DTLS).
# No FERRUM_DATAGRAM_PROXY_PROTOCOL_SECRET here: the datagram envelope is the unauthenticated
# address-trust posture. The authenticated posture runs in a second instance
# (proxyproto-auth.conf), because the secret is process-global.
#
# Stream listeners bind the IPv6 wildcard (dual-stack with the macOS/Linux defaults): an IPv4
# client from 127.0.0.1 arrives as ::ffff:127.0.0.1, which the IPv4 trust rule matches
# (src/util/cidr.rs), while a client connecting from ::1 is outside the trust list. That is
# how the lab reaches the "untrusted peer" branch on one loopback host without an alias
# (macOS has no 127.0.0.2 unless an administrator adds one).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18980
FERRUM_PROXY_HTTPS_PORT = 18981
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18990
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = "::"

FERRUM_TRUSTED_PROXIES = 127.0.0.1/32

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
# Server-only DTLS termination (ECDSA P-256/P-384 certificate required).
FERRUM_DTLS_CERT_PATH = "{{LAB_CERTS}}/server.crt"
FERRUM_DTLS_KEY_PATH = "{{LAB_CERTS}}/server.key"

# Expire idle UDP sessions quickly so their transaction summary (client_ip) is logged.
FERRUM_UDP_CLEANUP_INTERVAL_SECONDS = 1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
