# Ferrum Anvil failure lab - profile "streams" (gateway settings, ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered streams.conf> -c <rendered streams.yaml>
# Validate: ferrum-edge validate -m file -s <rendered streams.conf> -c <rendered streams.yaml>
# {{LAB_CERTS}} is filled with an absolute path by the lab runner.
#
# Frontend TLS is SERVER-ONLY here (no client CA), so HTTP/2 over TLS, HTTP/3, WebSocket
# extended CONNECT and DTLS can be exercised without client certificates.
# HTTP/3 binds UDP on the HTTPS port number (src/modes/file.rs:562-571,1537-1590).
# Stream listen ports (18401-18409) must not equal any configured HTTP/HTTPS/admin port
# (src/modes/file.rs:521-560).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18480
FERRUM_PROXY_HTTPS_PORT = 18443
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18490
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_ENABLE_HTTP3 = true
FERRUM_HTTP3_WEBSOCKET_ENABLED = true

# Server-only DTLS termination (ECDSA P-256/P-384 certificate required).
FERRUM_DTLS_CERT_PATH = "{{LAB_CERTS}}/server.crt"
FERRUM_DTLS_KEY_PATH = "{{LAB_CERTS}}/server.key"

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
