# Ferrum Anvil failure lab - profile "admission" (gateway settings, ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered admission.conf> -c <rendered admission.yaml>
# Validate: ferrum-edge validate -m file -s <rendered admission.conf> -c <rendered admission.yaml>
#
# Process-wide admission knobs live here, so this profile is its OWN gateway instance.
# Run `ulimit -n 4096` before launch on macOS so the FD-pressure tier of the overload manager
# cannot trip on the default 256 soft limit.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18580
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18590
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

# GW-002: one in-flight request = 100% of FERRUM_MAX_REQUESTS >= 0.95 critical threshold.
# The overload flag is sampled by the monitor every 100 ms (src/overload.rs:1236-1265).
FERRUM_MAX_REQUESTS = 1
FERRUM_OVERLOAD_CHECK_INTERVAL_MS = 100

# UP-015: a 64 KiB process-wide retained-response budget (floor = the fallback ceiling).
# A buffered response > 64 KiB but under the 10 MiB per-response ceiling cannot reserve
# capacity -> 503 gateway_buffer_capacity (src/proxy/response_buffer_budget.rs:469-491,803-830).
FERRUM_RESPONSE_BUFFER_FALLBACK_MAX_BYTES = 65536
FERRUM_RESPONSE_BUFFER_MAX_TOTAL_BYTES = 65536

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
