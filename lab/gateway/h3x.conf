# Ferrum Anvil failure lab - profile "h3x" (gateway settings, ferrum.conf format)
# Target binary: ferrum-edge v0.9.7 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered h3x.conf> -c <rendered h3x.yaml>
# Validate: ferrum-edge validate -m file -s <rendered h3x.conf> -c <rendered h3x.yaml>
# {{LAB_CERTS}} is filled with an absolute path by the lab runner.
#
# SSE over HTTP/3 and RFC 9298 CONNECT-UDP (MASQUE) through the gateway's QUIC
# listener (docs/lab/h3x.md). Frontend TLS is server-only. HTTP/3 binds UDP on the
# HTTPS port number. CONNECT-UDP is off by default in Ferrum Edge and is enabled
# process-wide here; the MASQUE route in h3x.yaml is the only route that admits
# CONNECT (every other route sets allowed_methods), as docs/http3.md recommends.
# Two more instances of this gateway serve the capability refusals:
# h3x-off.conf (CONNECT-UDP disabled) and h3x-noext.conf (no extended CONNECT).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18880
FERRUM_PROXY_HTTPS_PORT = 18843
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18890
FERRUM_ADMIN_HTTPS_PORT = 0

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_ENABLE_HTTP3 = true
FERRUM_HTTP3_WEBSOCKET_ENABLED = true
FERRUM_HTTP3_CONNECT_UDP_ENABLED = true
FERRUM_HTTP3_CONNECT_UDP_IDLE_TIMEOUT_SECONDS = 120

# The MASQUE route's backends are UDP sockets: no HTTP warmup probes against them.
FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
