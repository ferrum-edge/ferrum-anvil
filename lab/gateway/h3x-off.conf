# Ferrum Anvil failure lab - profile "h3x", second instance: CONNECT-UDP DISABLED
# (ferrum-edge v0.9.7, file mode, same h3x.yaml). WebSocket over HTTP/3 stays on, so
# the QUIC listener still advertises SETTINGS_ENABLE_CONNECT_PROTOCOL and a
# CONNECT-UDP request reaches the dispatcher, which answers 501 (docs/http3.md,
# "Refusals"). Ports: HTTP 18881, HTTPS+QUIC 18844, admin 18891.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18881
FERRUM_PROXY_HTTPS_PORT = 18844
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18891
FERRUM_ADMIN_HTTPS_PORT = 0

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_ENABLE_HTTP3 = true
FERRUM_HTTP3_WEBSOCKET_ENABLED = true
FERRUM_HTTP3_CONNECT_UDP_ENABLED = false

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
