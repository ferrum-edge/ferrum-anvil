# Ferrum Anvil failure lab - profile "mesh", AMBIENT instance (ferrum.conf format)
# Target binary: ferrum-edge v0.9.7 (lab/gateway/RELEASE.lock), MESH mode, localized file config, file SVIDs.
# Rendered by crates/anvil-lab/src/mesh.rs as a STRICT instance (HBONE 127.0.0.1:17618, admin 17691).
# Start:    ferrum-edge run      -m mesh -s <rendered mesh-ambient.conf> -c <rendered mesh-ambient.json>
# Validate: ferrum-edge validate -m mesh -s <rendered mesh-ambient.conf> -c <rendered mesh-ambient.json>
#
# Mesh document mesh-ambient.json: this proxy's LOCAL workload
# spiffe://cluster.local/ns/ferrum/sa/anvil-lab-ztunnel (declared at 127.0.0.1:17801) under a
# PeerAuthentication whose mode is {{MTLS_MODE}}. No node-agent registry is configured, so the Ambient
# relay inventory is retracted, and Ambient never relays to loopback: on this loopback-only lab every
# authenticated HBONE CONNECT is refused by the inbound relay destination guard. v0.9.7 refuses it at
# relay synthesis with a generic 404 {"error":"Not Found"} and a debug-level operator line
# (src/proxy/mod.rs build_inbound_hbone_relay_proxy), not the documented 403. A positive Ambient relay
# needs a non-loopback pod address (Kubernetes / a node agent) and is skipped with that reason.
# macOS: the Ambient UDP placement guard withholds /health readiness; the lab waits on /live instead.
#
# Tokens: {{MESH_PKI}} (ca.pem, ztunnel.pem/.key), {{LAB_RUN}}, {{MTLS_MODE}}, and the listener ports
# {{INBOUND_PORT}} {{OUTBOUND_PORT}} {{HBONE_PORT}} {{EGRESS_PORT}} {{DNS_PORT}} {{ADMIN_PORT}}
# (all 127.0.0.1 inside the mesh gateway block 17600-17799; none uses a default 150xx port).

FERRUM_MODE = mesh
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_MESH_TOPOLOGY = ambient
FERRUM_MESH_CONFIG_PROTOCOL = file
FERRUM_MESH_FILE_CONFIG_PATH = "{{LAB_RUN}}/mesh-ambient.json"
FERRUM_MESH_WORKLOAD_SPIFFE_ID = spiffe://cluster.local/ns/ferrum/sa/anvil-lab-ztunnel
FERRUM_GATEWAY_SVID_CERT_PATH = "{{MESH_PKI}}/ztunnel.pem"
FERRUM_GATEWAY_SVID_KEY_PATH = "{{MESH_PKI}}/ztunnel.key"
FERRUM_GATEWAY_SVID_TRUST_BUNDLE_PATH = "{{MESH_PKI}}/ca.pem"

# HBONE listener (the 15008-equivalent Anvil drives) and every other mesh listener, remapped.
FERRUM_MESH_HBONE_LISTEN_ADDR = 127.0.0.1:{{HBONE_PORT}}
FERRUM_MESH_INBOUND_LISTEN_ADDR = 127.0.0.1:{{INBOUND_PORT}}
FERRUM_MESH_OUTBOUND_LISTEN_ADDR = 127.0.0.1:{{OUTBOUND_PORT}}
FERRUM_MESH_EGRESS_LISTEN_ADDR = 127.0.0.1:{{EGRESS_PORT}}
FERRUM_MESH_DNS_PROXY_ENABLED = false
FERRUM_MESH_DNS_LISTEN_ADDR = 127.0.0.1:{{DNS_PORT}}
FERRUM_MESH_APP_PROBE_PORT = 0
FERRUM_MESH_FEDERATION_POLL_INTERVAL_SECONDS = 0

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 0
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = {{ADMIN_PORT}}
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
