# Ferrum Anvil failure lab - profile "early", second instance: early data OFF
# (gateway settings, ferrum.conf format). Same routes (early.yaml) and PKI as early.conf,
# without FERRUM_TLS_EARLY_DATA_METHODS: the HTTP/3 listener then uses its stateless
# rotating ticketer with max_early_data_size = 0 (src/http3/server.rs
# build_h3_quinn_server_config), so a client resumes but never sends early data.
# {{LAB_CERTS}} is filled with an absolute path by the lab runner.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 17281
FERRUM_PROXY_HTTPS_PORT = 17244
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 17291
FERRUM_ADMIN_HTTPS_PORT = 0

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_ENABLE_HTTP3 = true

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
