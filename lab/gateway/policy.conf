# Ferrum Anvil failure lab - profile "policy" (gateway settings, ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered policy.conf> -c <rendered policy.yaml>
# Validate: ferrum-edge validate -m file -s <rendered policy.conf> -c <rendered policy.yaml>
# No template tokens in this profile. The OPA mock (127.0.0.1:19202) and AI provider mock
# (127.0.0.1:19204) must be up before traffic is sent (not required for startup).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18280
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18290
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
