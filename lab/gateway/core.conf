# Ferrum Anvil failure lab - profile "core" (gateway settings, ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered core.conf> -c <rendered core.yaml>
# Validate: ferrum-edge validate -m file -s <rendered core.conf> -c <rendered core.yaml>
# Format: KEY = value (src/config/conf_file.rs; unknown keys are rejected).
# Secrets (FERRUM_ADMIN_JWT_SECRET, FERRUM_METRICS_BEARER_TOKEN) are passed as
# environment variables by the lab runner, never written here.
# See docs/audit/gateway-lab-config.md for citations and the port plan.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

# Listeners: loopback only. Proxy HTTP 18080, admin HTTP 18090, no TLS listeners.
FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18080
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18090
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

# Determinism: no startup warmup connections to fault fixtures, one accept loop.
FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1

# UP-001: every hostname lookup goes to the lab DNS fixture (UDP+TCP 19053),
# which answers NXDOMAIN. All other core backends are IP literals.
FERRUM_DNS_RESOLVER_ADDRESS = 127.0.0.1:19053
FERRUM_DNS_TRY_TCP_ON_ERROR = false
FERRUM_DNS_ERROR_TTL = 1

# Fast, bounded stop.
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
