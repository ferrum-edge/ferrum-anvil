# Ferrum Anvil failure lab - profile "h3x", third instance: NO EXTENDED CONNECT
# (ferrum-edge v0.9.7, file mode, same h3x.yaml). Neither WebSocket over HTTP/3 nor
# CONNECT-UDP is enabled, so the QUIC listener's SETTINGS do not advertise
# SETTINGS_ENABLE_CONNECT_PROTOCOL (src/http3/server.rs) and a CONNECT-UDP client
# must not send the request at all. Ports: HTTP 18882, HTTPS+QUIC 18845, admin 18892.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18882
FERRUM_PROXY_HTTPS_PORT = 18845
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18892
FERRUM_ADMIN_HTTPS_PORT = 0

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/server-chain.crt"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/server.key"
FERRUM_ENABLE_HTTP3 = true
FERRUM_HTTP3_WEBSOCKET_ENABLED = false
FERRUM_HTTP3_CONNECT_UDP_ENABLED = false

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
