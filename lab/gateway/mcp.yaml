# Ferrum Anvil failure lab - profile "mcp" (ferrum-edge v0.9.21, file mode)
#
# Scenarios: crates/anvil-lab/src/mcp.rs, docs/lab/mcp.md.
# Settings:  mcp.conf (proxy HTTP 127.0.0.1:17180, admin 127.0.0.1:17190).
# Fixtures:  17101  MCP server (Streamable HTTP, JSON answers) behind the gateway
#            17102  the same server answering with event streams (addressed directly; not routed here)
#
# mcp_gateway in aggregate-router mode (src/plugins/mcp_gateway.rs @ e27f210, McpGateway::new):
# one upstream server, namespace "fx" (public tool names "fx.<tool>"). Policy (policy.tools, keyed
# by public name): echo, add and fail are allowed; delete_all is denied; internal_audit is
# hide_from_discovery; session and new_tool are not configured, so default_action (deny) and
# discovery.on_new_tool (hide_until_configured, the default) hide them. Denied tools stay listed
# (policy.hide_denied_tools off), so tools/list tells a denial from a hidden tool. validation.validate_tool_arguments (on by default) checks tools/call arguments
# against the listed inputSchema before forwarding.
#
# v0.9.21 removed discovery.hide_denied_items (#7136; an unknown key fails config load), which v0.9.20
# needed set false here; policy.hide_denied_tools alone decides now.
version: "1"

resource_counts:
  proxies: 2
  consumers: 0
  plugin_configs: 3
  upstreams: 0

proxies:
  # The MCP endpoint. The plugin routes allowed calls to the server's upstream_url; the
  # backend fields name the same server (an HTTP/1.1-only fixture).
  - id: mcp-aggregate
    listen_path: /mcp
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 17101
    strip_listen_path: false
    pool_enable_http2: false
    plugins:
      - plugin_config_id: mcp-gateway

  # EXT-E21-MCP-BRIDGE: an OpenAPI bridge served from a regex route. v0.9.21 confines bridged
  # calls to a literal listen prefix, so every bridged call here is refused with JSON-RPC
  # -32603 (#7410, GHSA-26x8-8jq5-f73p); the backend (17101) is never called. A regex listen
  # path is anchored to the whole request path, so the pattern spells the subtree.
  - id: e21-mcp-bridge
    listen_path: "~/e21-bridge/.*"
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 17101
    strip_listen_path: false
    pool_enable_http2: false
    plugins:
      - plugin_config_id: e21-mcp-bridge

plugin_configs:
  - id: mcp-gateway
    plugin_name: mcp_gateway
    scope: proxy
    proxy_id: mcp-aggregate
    enabled: true
    config:
      mode: aggregate_router
      endpoint:
        path: /mcp
      servers:
        fx:
          upstream_url: "http://127.0.0.1:17101/mcp"
          namespace: fx
      policy:
        default_action: deny
        hide_denied_tools: false
        tools:
          fx.echo: { action: allow }
          fx.add: { action: allow }
          fx.fail: { action: allow }
          fx.delete_all: { action: deny }
          fx.internal_audit: { action: hide_from_discovery }
      validation:
        validate_tool_arguments: true

  - id: lab-access-log
    plugin_name: stdout_logging
    scope: global
    enabled: true
    config: {}

  - id: e21-mcp-bridge
    plugin_name: mcp_gateway
    scope: proxy
    proxy_id: e21-mcp-bridge
    enabled: true
    config:
      mode: aggregate_router
      endpoint:
        path: /e21-bridge/mcp
      servers:
        br:
          namespace: br
          openapi:
            operations:
              - name: ping
                method: GET
                path: /e21-bridge/ping
      # Listed explicitly: discovery.on_new_tool defaults to hide_until_configured, which
      # refused the unlisted generated tool with -32001 before the route check (Lab run
      # 46068538969).
      policy:
        default_action: allow
        tools:
          br.ping: { action: allow }
