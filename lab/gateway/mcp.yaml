# Ferrum Anvil failure lab - profile "mcp" (ferrum-edge v0.9.10, v0.9.9, v0.9.8, v0.9.7 and v0.9.5, file mode)
#
# Scenarios: crates/anvil-lab/src/mcp.rs, docs/lab/mcp.md.
# Settings:  mcp.conf (proxy HTTP 127.0.0.1:17180, admin 127.0.0.1:17190).
# Fixtures:  17101  MCP server (Streamable HTTP, JSON answers) behind the gateway
#            17102  the same server answering with event streams (addressed directly; not routed here)
#
# mcp_gateway in aggregate-router mode (src/plugins/mcp_gateway.rs @ e27f210, McpGateway::new):
# one upstream server, namespace "fx" (public tool names "fx.<tool>"). Policy (policy.tools, keyed
# by public name): echo, add and fail are allowed; delete_all is denied; internal_audit is
# hide_from_discovery; session and new_tool are not configured, so default_action (deny) and
# discovery.on_new_tool (hide_until_configured, the default) hide them. Denied tools stay listed
# (policy.hide_denied_tools and discovery.hide_denied_items off), so tools/list tells a denial from
# a hidden tool. validation.validate_tool_arguments (on by default) checks tools/call arguments
# against the listed inputSchema before forwarding.
version: "1"

resource_counts:
  proxies: 1
  consumers: 0
  plugin_configs: 2
  upstreams: 0

proxies:
  # The MCP endpoint. The plugin routes allowed calls to the server's upstream_url; the
  # backend fields name the same server (an HTTP/1.1-only fixture).
  - id: mcp-aggregate
    listen_path: /mcp
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 17101
    strip_listen_path: false
    pool_enable_http2: false
    plugins:
      - plugin_config_id: mcp-gateway

plugin_configs:
  - id: mcp-gateway
    plugin_name: mcp_gateway
    scope: proxy
    proxy_id: mcp-aggregate
    enabled: true
    config:
      mode: aggregate_router
      endpoint:
        path: /mcp
      servers:
        fx:
          upstream_url: "http://127.0.0.1:17101/mcp"
          namespace: fx
      policy:
        default_action: deny
        hide_denied_tools: false
        tools:
          fx.echo: { action: allow }
          fx.add: { action: allow }
          fx.fail: { action: allow }
          fx.delete_all: { action: deny }
          fx.internal_audit: { action: hide_from_discovery }
      discovery:
        hide_denied_items: false
      validation:
        validate_tool_arguments: true

  - id: lab-access-log
    plugin_name: stdout_logging
    scope: global
    enabled: true
    config: {}
