# Ferrum Anvil failure lab - profile "workload", the RELYING gateway (ferrum.conf format)
# Target binaries: ferrum-edge v0.9.7 (default pin) and v0.9.5, file mode.
# Start:    ferrum-edge run      -m file -s <rendered workload-proxy.conf> -c <rendered workload-proxy.yaml>
# Validate: ferrum-edge validate -m file -s <rendered workload-proxy.conf> -c <rendered workload-proxy.yaml>
#
# Ferrum Edge has no data-path JWT-SVID verifier; its generic jwks_auth plugin validates a JWT-SVID as
# an ES256 JWT against a JWKS with an audience. The lab fetches the trust domain's JWKS from the
# workload-mesh instance's Workload API (FetchJWTBundles, through Anvil's own client) after that
# instance is up, and renders it inline into workload-proxy.yaml before this instance starts.
# Proxy HTTP 127.0.0.1:17480, admin 127.0.0.1:17491 (gateway block 17400-17499).

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 17480
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 17491
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
