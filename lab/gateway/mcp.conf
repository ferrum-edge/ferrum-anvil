# Ferrum Anvil failure lab - profile "mcp" (gateway settings, ferrum.conf format)
# Target binaries: ferrum-edge v0.9.9 (default pin), v0.9.8, v0.9.7 and v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered mcp.conf> -c <rendered mcp.yaml>
# Validate: ferrum-edge validate -m file -s <rendered mcp.conf> -c <rendered mcp.yaml>
#
# Outside the 18N/19N port rule (docs/audit/gateway-lab-config.md §3): gateway 171xx
# (HTTP 17180, admin 17190), fixtures 17101-17102. Plain HTTP only: the MCP scenarios are about
# the mcp_gateway plugin's JSON-RPC outcomes, not TLS.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 17180
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 17190
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
