# Ferrum Anvil failure lab - profile "admission" (ferrum-edge v0.9.5, file mode)
#
# Scenarios: UP-015 (gateway retained-buffer capacity), GW-002 (overload refusal).
# Settings:  admission.conf (proxy HTTP 127.0.0.1:18580, admin 127.0.0.1:18590).
# Fixtures:  127.0.0.1:19500-19599.
#   19501  HTTP/1.1 sized responder: /big -> 262144-byte body, /small -> 32768-byte body
#          (both with Content-Length, application/octet-stream)
#   19502  HTTP/1.1 staller: reads the request, answers 200 after a configurable hold (default 5 s)
# Run UP-015 and GW-002 sequentially: with FERRUM_MAX_REQUESTS=1 any second concurrent
# request is refused as overload.
version: "1"

resource_counts:
  proxies: 3
  consumers: 0
  plugin_configs: 1
  upstreams: 0

proxies:
  # UP-015: buffered response. /up/buffer-capacity/big -> 503 gateway_buffer_capacity;
  # /up/buffer-capacity/small -> 200 (control).
  - id: up015-buffer-capacity
    listen_path: /up/buffer-capacity
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19501
    strip_listen_path: true
    pool_enable_http2: false
    response_body_mode: buffer

  # GW-002 occupant: holds the only request slot.
  - id: gw002-occupant
    listen_path: /gw/occupant
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19502
    strip_listen_path: true
    pool_enable_http2: false
    backend_read_timeout_ms: 20000

  # GW-002 probe: sent >= 300 ms after the occupant started; answered by the overload fence
  # before routing (503 overload). Recovery request: /gw/probe/small once the occupant has
  # finished (a lone 32 KiB eager-buffered response fits the 64 KiB budget).
  - id: gw002-probe
    listen_path: /gw/probe
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19501
    strip_listen_path: true
    pool_enable_http2: false

plugin_configs:
  - id: lab-access-log
    plugin_name: stdout_logging
    scope: global
    enabled: true
    config: {}
