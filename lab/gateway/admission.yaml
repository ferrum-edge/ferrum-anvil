# Ferrum Anvil failure lab - profile "admission" (ferrum-edge v0.9.5, file mode)
#
# Scenarios: UP-015 (gateway retained-buffer capacity), GW-002 (overload refusal).
# Settings:  admission.conf (proxy HTTP 127.0.0.1:18580, admin 127.0.0.1:18590).
# Fixtures:  127.0.0.1:19500-19599 (crates/anvil-lab/src/fixtures_policy.rs).
#   19501  HTTP/1.1 sized responder: /bytes/{n} -> n-byte body with Content-Length
#          (262144 = over budget, 32768 = fits), /status/{code}?body=... for lookalikes
#   19502  HTTP/1.1 staller: /delay-headers/{ms} holds the response, then answers 200
# Driven by: crates/anvil-lab/src/admission.rs (`cargo run -p anvil-lab -- run admission`).
# Run UP-015 and GW-002 sequentially: with FERRUM_MAX_REQUESTS=1 any second concurrent
# request is refused as overload.
version: "1"

resource_counts:
  proxies: 3
  consumers: 0
  plugin_configs: 1
  upstreams: 0

proxies:
  # UP-015: buffered response. /up/buffer-capacity/bytes/262144 -> 503 gateway_buffer_capacity;
  # /up/buffer-capacity/bytes/32768 -> 200 (recovery/control).
  - id: up015-buffer-capacity
    listen_path: /up/buffer-capacity
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19501
    strip_listen_path: true
    pool_enable_http2: false
    response_body_mode: buffer

  # GW-002 occupant: holds the only request slot.
  - id: gw002-occupant
    listen_path: /gw/occupant
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19502
    strip_listen_path: true
    pool_enable_http2: false
    backend_read_timeout_ms: 20000

  # GW-002 probe: sent >= 300 ms after the occupant started; answered by the overload fence
  # before routing (503 overload). Recovery request: /gw/probe/bytes/32768 once the occupant
  # has finished. Lookalike: /gw/probe/status/503 with a byte-identical "Service overloaded"
  # body authored by the backend.
  - id: gw002-probe
    listen_path: /gw/probe
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19501
    strip_listen_path: true
    pool_enable_http2: false

plugin_configs:
  - id: lab-access-log
    plugin_name: stdout_logging
    scope: global
    enabled: true
    config: {}
