# Ferrum Anvil failure lab - profile "streams" (ferrum-edge v0.9.5, file mode)
#
# Scenarios (crates/anvil-lab/src/streams.rs, docs/lab/streams-cpdp.md):
#   HTTP/1.1 keep-alive, HTTP/2 (h2 over TLS + h2c), HTTP/3 through the QUIC listener,
#   WebSocket (HTTP/1.1 Upgrade + RFC 8441 extended CONNECT), gRPC (4 call modes, error
#   status, backend down, deadlines, missing trailers), SSE (events, idle, mid-stream abort),
#   TCP (echo, half-close, backend refused), TCP+TLS -> tcps, UDP (echo, silent, lossy), DTLS.
# Settings:  streams.conf. Gateway: HTTP 127.0.0.1:18480 (h1 + h2c), HTTPS+H3 127.0.0.1:18443
#            (TCP h1/h2 + UDP QUIC), admin 127.0.0.1:18490, streams 127.0.0.1:18401-18409.
# Fixtures:  127.0.0.1:19400-19499 (ports marked "unbound" must stay closed: they are stimuli).
#
# Stream proxies route on listen_port, MUST NOT set listen_path, and MUST set backend_scheme
# (tcp | tcps | udp | dtls) (src/config/types.rs:7890-7897,8177-8182). WebSocket and gRPC are
# NOT schemes: an http/https proxy detects them per request (docs/routing.md:9-12).
# {{LAB_CERTS}} is rendered by the lab runner (per-run ephemeral PKI, never committed).
version: "1"

resource_counts:
  proxies: 18
  consumers: 0
  plugin_configs: 1
  upstreams: 0

proxies:
  # ---- HTTP family --------------------------------------------------------
  # Positive control, HTTP/1.1 keep-alive (PROTO-001), h2 over TLS, h2c: /proto/http/* -> /*
  # on an HTTP/1-only backend leg.
  - id: proto-http-echo
    listen_path: /proto/http
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19403
    strip_listen_path: true
    pool_enable_http2: false

  # PROTO-002: HTTP/2 end to end. The backend on 19417 is TLS with ALPN h2 (lab CA), so the
  # capability probe classifies it h2_tls and the gateway uses its direct HTTP/2 pool.
  # (A cleartext h2c-capable backend is still reached over HTTP/1.1 for plain HTTP.)
  - id: proto002-h2-trailers
    listen_path: /proto/h2
    backend_scheme: https
    backend_host: 127.0.0.1
    backend_port: 19417
    strip_listen_path: true
    backend_tls_server_ca_cert_path: "{{LAB_CERTS}}/ca.crt"

  # PROTO-006/007/008: forced HTTP/3 and H3->TCP fallback: /proto/h3/* -> /*.
  - id: proto006-h3-echo
    listen_path: /proto/h3
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19403
    strip_listen_path: true
    pool_enable_http2: false

  # PROTO-009/010/012/013: WebSocket echo; the backend leg is always HTTP/1.1 Upgrade.
  #   H1 Upgrade:          ws://127.0.0.1:18480/ws
  #   H2 extended CONNECT: h2c on 18480 or h2 (TLS) on 18443, :protocol=websocket
  - id: proto012-ws-echo
    listen_path: /ws
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19401
    strip_listen_path: false
    pool_enable_http2: false

  # PROTO-014/015/016: gRPC anvil.lab.v1.Echo (lab/proto/echo.proto) on an h2c backend.
  # gRPC paths are /package.Service/Method, so the route is the service prefix, not stripped.
  - id: proto014-grpc
    listen_path: /anvil.lab.v1.Echo
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19402
    strip_listen_path: false

  # PROTO-014 (backend down): /grpc-down/anvil.lab.v1.Echo/* -> 19409, which is UNBOUND.
  - id: proto014-grpc-down
    listen_path: /grpc-down
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19409
    strip_listen_path: true

  # PROTO-016 (gateway backend deadline): the backend on 19412 holds response headers for 4 s;
  # the gateway's 1 s read timeout answers first.
  - id: proto016-grpc-slow
    listen_path: /grpc-slow
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19412
    strip_listen_path: true
    backend_read_timeout_ms: 1000

  # PROTO-018: server-sent events (/sse?count=&interval= on the HTTP fixture).
  - id: proto018-sse
    listen_path: /sse
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19413
    strip_listen_path: false
    pool_enable_http2: false

  # TRUST-007 (SSE variant): the backend on 19416 aborts its event stream mid-body.
  - id: proto018-sse-abort
    listen_path: /sse-abort
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 19416
    strip_listen_path: true
    pool_enable_http2: false

  # ---- L4 stream proxies ----------------------------------------------------
  # PROTO-019: TCP echo that replies only after it reads EOF (client half-close).
  - id: proto019-tcp-halfclose
    listen_port: 18401
    backend_scheme: tcp
    backend_host: 127.0.0.1
    backend_port: 19404
    tcp_idle_timeout_seconds: 30

  # PROTO-020: UDP to a fixture that never replies.
  - id: proto020-udp-silent
    listen_port: 18402
    backend_scheme: udp
    backend_host: 127.0.0.1
    backend_port: 19406
    udp_idle_timeout_seconds: 30

  # PROTO-021: UDP echo that answers only every other datagram.
  - id: proto021-udp-lossy
    listen_port: 18403
    backend_scheme: udp
    backend_host: 127.0.0.1
    backend_port: 19407
    udp_idle_timeout_seconds: 30

  # UDP positive control / recovery (plain echo).
  - id: udp-echo
    listen_port: 18404
    backend_scheme: udp
    backend_host: 127.0.0.1
    backend_port: 19405
    udp_idle_timeout_seconds: 30

  # PROTO-022: DTLS terminated at the gateway (server-only; FERRUM_DTLS_CERT_PATH) -> UDP echo.
  - id: proto022-dtls
    listen_port: 18405
    backend_scheme: udp
    backend_host: 127.0.0.1
    backend_port: 19405
    frontend_tls: true
    udp_idle_timeout_seconds: 30

  # TCP+TLS: TLS terminated at the gateway, re-originated as TLS (tcps) to a TLS echo whose
  # certificate chains to the lab CA (verified against backend_host 127.0.0.1, an IP SAN).
  - id: tcp-tls-echo
    listen_port: 18406
    backend_scheme: tcps
    backend_host: 127.0.0.1
    backend_port: 19411
    frontend_tls: true
    backend_tls_server_ca_cert_path: "{{LAB_CERTS}}/ca.crt"
    tcp_idle_timeout_seconds: 30

  # Backend refused on a TCP stream: 19410 is UNBOUND.
  - id: tcp-refused
    listen_port: 18407
    backend_scheme: tcp
    backend_host: 127.0.0.1
    backend_port: 19410
    tcp_idle_timeout_seconds: 30

  # Plain TCP echo (newline-framed exchange).
  - id: tcp-echo
    listen_port: 18408
    backend_scheme: tcp
    backend_host: 127.0.0.1
    backend_port: 19408
    tcp_idle_timeout_seconds: 30

  # Lookalike: client TLS to the gateway succeeds, but the gateway's tcps leg to 19414
  # fails verification (certificate from a CA the gateway does not trust).
  - id: tcps-untrusted
    listen_port: 18409
    backend_scheme: tcps
    backend_host: 127.0.0.1
    backend_port: 19414
    frontend_tls: true
    backend_tls_server_ca_cert_path: "{{LAB_CERTS}}/ca.crt"
    tcp_idle_timeout_seconds: 30

plugin_configs:
  - id: lab-access-log
    plugin_name: stdout_logging
    scope: global
    enabled: true
    config: {}
