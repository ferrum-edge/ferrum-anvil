# Ferrum Anvil failure lab - profile "tls", second instance: TLS 1.2 only.
# Target binary: ferrum-edge v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Validate: ferrum-edge validate -m file -s <rendered tls.tls12.conf> -c <rendered tls.tls12.yaml>
#
# Same frontend certificate and client CA as tls.conf, but FERRUM_TLS_MAX_VERSION = 1.2, so:
#  * TLS-005.tls12 / TLS-006.tls12 observe the TLS 1.2 client-certificate refusal shape
#    (the rejection happens inside the handshake, unlike TLS 1.3);
#  * TLS-X01 (client requires TLS 1.3) observes a genuine protocol-version refusal.
# Ports stay inside the tls block: HTTPS 18344, admin 18391, no plaintext listener.

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 0
FERRUM_PROXY_HTTPS_PORT = 18344
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18391
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_FRONTEND_TLS_CERT_PATH = "{{LAB_CERTS}}/gateway-server.pem"
FERRUM_FRONTEND_TLS_KEY_PATH = "{{LAB_CERTS}}/gateway-server.key"
FERRUM_FRONTEND_TLS_CLIENT_CA_BUNDLE_PATH = "{{LAB_CERTS}}/client-ca.pem"
FERRUM_FRONTEND_TLS_HANDSHAKE_TIMEOUT_SECONDS = 5
FERRUM_TLS_MIN_VERSION = 1.2
FERRUM_TLS_MAX_VERSION = 1.2

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
