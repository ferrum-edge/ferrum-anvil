# Ferrum Anvil failure lab - profile "cpdp", ORPHAN DATA PLANE (no CP at all) (ferrum.conf format)
# Target binary: ferrum-edge v0.9.5. GW-005 (config_stale), CP-less variant.
# Start:    ferrum-edge run      -m dp -s <rendered cpdp-dp-orphan.conf>
#
# Nothing listens on 127.0.0.1:18799. The DP's authority starts as Lost and its snapshot age
# is measured from process start (src/dp_config_freshness.rs:347-365,657-680), so ~2 s after
# start every new request is refused: 503 {"error":"Gateway configuration stale"},
# X-Gateway-Error: config_stale. Before that, any path returns 404 (empty config).
# This is a genuine stale fence (no CP ever authoritative), but it does NOT exercise
# "had config, then lost the CP" - use cpdp-cp.conf + cpdp-dp.conf for that.
# Required ENVIRONMENT: FERRUM_ADMIN_JWT_SECRET and FERRUM_CP_DP_GRPC_JWT_SECRET
# (>= 32 chars each, different values).

FERRUM_MODE = dp
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_DP_CP_GRPC_URLS = http://127.0.0.1:18799
FERRUM_DP_CONFIG_MAX_STALE_SECONDS = 2
FERRUM_DP_CONFIG_STALE_ACTION = fail_closed

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18770
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18771
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_ACCEPT_THREADS = 1
FERRUM_SHUTDOWN_DRAIN_SECONDS = 2
