# Ferrum Anvil failure lab - profile "drain" (gateway settings, ferrum.conf format)
# Target binary: ferrum-edge v0.9.5 (ferrum-edge-macos-aarch64), file mode.
# Start:    ferrum-edge run      -m file -s <rendered drain.conf> -c <rendered drain.yaml>
# Validate: ferrum-edge validate -m file -s <rendered drain.conf> -c <rendered drain.yaml>
#
# GW-003 is destructive: the test SIGTERMs this instance. Restart it for every run.
# Timeline after SIGTERM (docs/graceful_shutdown.md:9-26):
#   t0          /health -> 503 {"status":"draining","ready":false}; /live stays 200
#   t0..t0+3s   pre-drain: listeners still accept, proxy traffic still served
#   t0+3s       accept loops close (new TCP connects refused); in-flight requests drain
#   <= t0+13s   drain wait ends, remaining connections force-closed

FERRUM_MODE = file
FERRUM_NAMESPACE = ferrum
FERRUM_LOG_LEVEL = info

FERRUM_PROXY_BIND_ADDRESS = 127.0.0.1
FERRUM_PROXY_HTTP_PORT = 18680
FERRUM_PROXY_HTTPS_PORT = 0
FERRUM_ADMIN_BIND_ADDRESS = 127.0.0.1
FERRUM_ADMIN_HTTP_PORT = 18690
FERRUM_ADMIN_HTTPS_PORT = 0
FERRUM_STREAM_PROXY_BIND_ADDRESS = 127.0.0.1

FERRUM_SHUTDOWN_PREDRAIN_SECONDS = 3
FERRUM_SHUTDOWN_DRAIN_SECONDS = 10

FERRUM_POOL_WARMUP_ENABLED = false
FERRUM_ACCEPT_THREADS = 1
