[package]
name = "anvil-app"
description = "Application services shared by the Anvil desktop shell and CLI: profiles, workspace tree, revisions, execution context building, history, portability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anvil-domain.workspace = true
anvil-storage.workspace = true
anvil-engine.workspace = true
anvil-transport.workspace = true
anvil-portability.workspace = true
anvil-diagnostics.workspace = true
anvil-load.workspace = true
anvil-import.workspace = true
url.workspace = true
anvil-runner.workspace = true
anvil-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
parking_lot.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Fault injection in the import atomicity tests (a trigger that fails a write).
rusqlite.workspace = true
tokio-util.workspace = true
anvil-fixtures = { path = "../anvil-fixtures" }
# CI-only provider for the linked-identity tests (never in release builds).
anvil-identity = { workspace = true, features = ["mock-provider"] }
# Re-packs bundles in the import tests.
zip.workspace = true
# In-memory mock credential store for the keychain conversion tests.
keyring-core.workspace = true

[lints]
workspace = true
