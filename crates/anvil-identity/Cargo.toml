[package]
name = "anvil-identity"
description = "Interactive native-app OAuth (RFC 8252 loopback + PKCE) for target-API sign-in, and the application-login provider abstraction (identity only — never a vault key)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
# CI/test-only identity provider that runs a real loopback PKCE flow against a
# local fixture issuer. Never enabled by release builds (only dev-dependencies
# turn it on); it also refuses non-loopback endpoints.
mock-provider = []

[dependencies]
anvil-domain.workspace = true
anvil-auth.workspace = true
anvil-engine.workspace = true
anvil-transport.workspace = true
tokio.workspace = true
tokio-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
zeroize.workspace = true

[dev-dependencies]
anvil-fixtures = { path = "../anvil-fixtures" }
tokio.workspace = true

[lints]
workspace = true
