# cargo-deny policy for Ferrum Anvil (cargo-deny 0.20.x; CI pins 0.20.2).
#
#   cargo deny check                 # advisories, bans, licenses, sources
#   cargo deny check licenses        # one check
#
# Ferrum Anvil is PolyForm Noncommercial 1.0.0 + a separate commercial
# license (LICENSE, LICENSE-COMMERCIAL.md). Dependencies must be permissive so
# that both the noncommercial and the commercial distribution remain possible:
# copyleft (GPL/LGPL/AGPL/EUPL/SSPL/...) is not on the allowlist and fails the
# check. Weak (file-level) copyleft is accepted only as a reviewed per-crate
# exception. scripts/licenses.mjs reads [licenses] below and applies the same
# policy to npm packages bundled into the desktop UI.

[graph]
# Check the graph that is actually built for every supported release target.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Release feature set: default features only. The `e2e` feature (embedded
# WebDriver) must never be in a release graph; see [bans] below.
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RustSec advisory database (fetched by cargo-deny).
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# Every entry needs a reason and an exit condition. Reviewed 2026-09-25
# (RUSTSEC-2026-0387 added 2026-10-24);
# these are also listed as open items in docs/release.md.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing side channel, via jsonwebtoken's rust_crypto backend (anvil-auth RS256 signing). Anvil only signs caller-built JWTs locally; it performs no RSA decryption and exposes no network-observable private-key oracle. No patched rsa release exists. Exit: RustCrypto/RSA#626 fixed, or jsonwebtoken switched to a constant-time backend." },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsoundness, via Tauri's Linux GTK stack (gtk-rs 0.18 is pinned by tauri/wry/tao/muda/webkit2gtk 2.0). Neither Anvil nor those crates (nor rfd) call VariantStrIter. Exit: Tauri moves to gtk >= 0.19 (glib >= 0.20)." },
    { id = "RUSTSEC-2026-0367", reason = "zip extraction preserves SUID/SGID bits. Anvil's own zip use is 9.0.4 (patched) and reads entries in memory without extract(); the flagged 4.6.1 arrives only via tauri-plugin-updater, which verifies the release signature (require_signed_version, signed updater artifacts) before extracting, so reaching extract() needs a validly signed update archive. No patched zip 4.x exists. Exit: tauri-plugin-updater moves to zip >= 9. Owner-accepted 2026-10-20." },
    { id = "RUSTSEC-2026-0368", reason = "zip ZipArchive::extract symlink targets escape the destination. Same scope as RUSTSEC-2026-0367: patched direct zip 9.0.4 without extract(); unpatched 4.6.1 only via the signature-verified in-app updater. Exit: tauri-plugin-updater moves to zip >= 9. Owner-accepted 2026-10-20." },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() applies Unix permissions through symlinks. Same scope as RUSTSEC-2026-0367: patched direct zip 9.0.4 without extract(); unpatched 4.6.1 only via the signature-verified in-app updater. Exit: tauri-plugin-updater moves to zip >= 9. Owner-accepted 2026-10-20." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability in operations meant to be constant-time; fixed only in >= 0.7.6, no patched 0.5.x. The 0.7 copy (p256 0.14, used directly by anvil-auth) is bumped to the fixed 0.7.7; 0.5.5 remains via dimpl 0.7.5 (rust-crypto: ecdsa 0.16 / p256 0.13 / p384 0.13) and jsonwebtoken 11.1.0 (rust_crypto: p256 0.13 / p384 0.13). The latest releases (dimpl 0.8.0, jsonwebtoken 11.1.0) still require p256 ^0.13. SECRET-DEPENDENT USE IS REACHABLE: ES256 JWT and DPoP proof signing with operator-supplied keys (anvil-auth via jsonwebtoken) and DTLS ECDSA client/fixture signing (P-256) run p256 0.13 scalar arithmetic (add_mod/sub_mod/mul_wide/sbb/ct_lt) on crypto-bigint 0.5.5 with the private key and nonce. P-384 uses fiat-crypto, and ECDHE uses crypto-bigint only for encoding and range checks. The code that 0.7.6 changed is not present in 0.5.5 in that form (the borrowing_sub branch is 0.7-only; zero counting, division and Montgomery are not on this path; UintRef/BoxedMontyForm are absent), but 0.5.5 has never had a cargo checkct check. Signing is local to the operator's machine. Exit: dimpl and jsonwebtoken move to p256/p384 0.14 (elliptic-curve 0.14 / crypto-bigint >= 0.7.6), or Anvil switches both to aws-lc-rs backends. Review by 2026-11-30. Pending owner acceptance." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.93
exceptions = [
    # MPL-2.0 is file-level copyleft: compatible with distributing Anvil under
    # its own terms as long as these crates' files stay available under
    # MPL-2.0. They are used unmodified from crates.io (Tauri's HTML/CSS
    # tooling and the `dirs` family). Listed in THIRD_PARTY_LICENSES.md.
    { allow = ["MPL-2.0"], crate = "cssparser" }, # Tauri (html5ever/kuchikiki CSS selectors); unmodified
    { allow = ["MPL-2.0"], crate = "cssparser-macros" }, # Tauri (cssparser proc macros); unmodified
    { allow = ["MPL-2.0"], crate = "dtoa-short" }, # Tauri (cssparser number formatting); unmodified
    { allow = ["MPL-2.0"], crate = "selectors" }, # Tauri (CSS selector matching for asset injection); unmodified
    { allow = ["MPL-2.0"], crate = "option-ext" }, # dirs-sys (platform data directories); unmodified
]

[licenses.private]
# Anvil's own workspace crates are `publish = false` and carry the project
# license (LICENSE); they are not third-party dependencies.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; that is fine for private crates.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # Test-only embedded WebDriver server. It is an optional dependency behind
    # the non-default `e2e` feature of anvil-desktop; if it ever enters the
    # default (release) graph this check fails. scripts/release-check.sh
    # additionally inspects the built binaries.
    { crate = "tauri-plugin-wdio-webdriver", reason = "test-only WebDriver server must never ship" },
]
skip = []
skip-tree = []

[sources]
# crates.io only: no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
