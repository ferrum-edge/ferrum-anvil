# Real-gateway failure lab: a pinned Ferrum Edge release binary (verified
# against lab/gateway/RELEASE.lock, or lab/gateway/releases/<release>.lock)
# plus controllable fixtures, running the failure-matrix scenarios through
# Anvil's engine with and without the destination declared as a trusted
# Ferrum profile.
#   PR (engine/diagnostics/lab changes): default pin; all profiles, core only on macOS
#   nightly:                             all profiles, default pin + every earlier supported release
#   manual:                              chosen profile and release
# PRs run every profile (except on macOS, to spare its runners) so a change
# that breaks a non-core scenario shows on the PR, not first in the nightly
# run: a dependency bump that broke DTLS mTLS (PROTO-022 in `tls`) once merged
# green on core alone. Lab is not a required check (it is path-filtered); when
# it runs on a PR it must pass before merging (docs/ci.md).
name: Lab

on:
  pull_request:
    paths:
      - "crates/**"
      - "lab/**"
      - "vendor/**"
      - "catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lab.yml"
      - ".github/actions/setup/**"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Lab profile to run (core, all, ...)
        default: all
        required: true
      release:
        description: Gateway release (lab/gateway/releases/<release>.lock); empty = RELEASE.lock
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lab:
    # The default pin keeps the historical job name (required-check names stay stable).
    name: Lab · ${{ matrix.os }}${{ matrix.release && format(' · {0}', matrix.release) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
        # "" = the default pin (RELEASE.lock). Nightly also re-runs every earlier supported release.
        release: ${{ fromJSON(github.event_name == 'schedule' && '["", "v0.9.14", "v0.9.11", "v0.9.10", "v0.9.9", "v0.9.8", "v0.9.7", "v0.9.5"]' || format('["{0}"]', inputs.release || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ANVIL_LAB_RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tauri-deps: "false"
          node: "false"
          cache-key: lab
      - name: Lint gateway lab profiles (plugin keys accepted by every supported release)
        run: ruby lab/gateway/lint-profiles.rb
      - name: Fetch and verify the pinned Ferrum Edge gateway
        env:
          GH_TOKEN: ${{ github.token }}
        run: lab/scripts/fetch-gateway.sh
      - name: Verify gateway identity
        run: cargo run --locked -p anvil-lab -- verify
      - name: Run lab
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && (runner.os == 'macOS' && 'core' || 'all') || inputs.profile || 'all' }}
        run: |
          ulimit -n 4096 2>/dev/null || true
          echo "profile: $PROFILE"
          cargo run --locked -p anvil-lab -- run "$PROFILE" --untrusted-pass
      - name: Upload lab results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-results-${{ matrix.os }}-${{ matrix.release || 'pinned' }}-${{ github.run_id }}
          path: |
            results/lab/**
            lab/.run/**/*.log
          if-no-files-found: warn
          retention-days: 30
