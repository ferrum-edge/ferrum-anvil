# Edge main early warning (ferrum-edge/ferrum-contracts#76; docs/consumer-pins.md
# "Checking against Edge main" in ferrum-contracts). Anvil catalogs released
# Edge builds, and the contract tests compare the error and diagnostic
# vocabularies it imports with the pinned contracts-edge copy only. This
# workflow runs the same parity checks against ferrum-contracts `main`, whose
# vocabularies record what Edge `main` changes (`main_branch_delta`), so a
# change there shows up before Anvil re-pins:
#   contracts_adoption::contracts_main_vocabularies_match_anvil
#   contracts_adoption::contracts_main_diagnostic_ref_matches_anvils_reader
# (ignored tests that read ANVIL_CONTRACTS_MAIN_DIR).
#
# Never a required check. A failure opens or updates one issue labelled
# `edge-main-drift`, and a clean run closes it. Only the `issue` job can write,
# and only issues, with this repository's GITHUB_TOKEN; the job that builds
# and runs the tests holds `contents: read`. Pull requests that change this
# workflow run the check without touching the issue. The real-gateway lab is
# not part of it: the lab diagnoses a gateway with its release's audited
# catalog, which Edge `main` does not have (docs/ci.md).
name: Edge main drift

on:
  schedule:
    - cron: "59 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/edge-main-drift.yml"

permissions:
  contents: read

concurrency:
  group: edge-main-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Edge main drift check
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
      contracts-commit: ${{ steps.contracts.outputs.contracts }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tauri-deps: "false"
          node: "false"
          cache-key: edge-main-drift

      - name: Fetch the vendored contract files from ferrum-contracts main
        id: contracts
        # The same paths contracts/ferrum-contracts/PIN lists, read at one
        # resolved ferrum-contracts commit. A file Anvil vendors that main no
        # longer has is a finding; any other fetch failure stops the run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolve() {
            local head
            head=$(git ls-remote "https://github.com/ferrum-edge/$1" refs/heads/main | cut -f1)
            if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve ferrum-edge/$1 main: $head" >&2
              exit 1
            fi
            echo "$head"
          }
          contracts=$(resolve ferrum-contracts)
          edge_head=$(resolve ferrum-edge)
          dir="$RUNNER_TEMP/contracts-main"
          missing=""
          while read -r path; do
            if ! [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$path" == *..* ]]; then
              echo "::error::Unexpected PIN path: $path"
              exit 1
            fi
            mkdir -p "$dir/$(dirname "$path")"
            status=$(curl -sS -o "$dir/$path" -w '%{http_code}' \
              "https://raw.githubusercontent.com/ferrum-edge/ferrum-contracts/$contracts/$path")
            case "$status" in
              200) ;;
              404)
                rm -f "$dir/$path"
                missing="$missing $path"
                ;;
              *)
                echo "::error::Fetching $path at $contracts answered HTTP $status"
                exit 1
                ;;
            esac
          done < <(awk '$1 == "sha256" { print $3 }' contracts/ferrum-contracts/PIN)

          # main_branch_delta.commit is the Edge commit the vocabularies were
          # last read at; when Edge main is past it, newer changes may not be
          # recorded yet.
          delta=$(jq -r '.main_branch_delta.commit // ""' "$dir/vocabularies/gateway-errors.json" 2>/dev/null || true)
          if [[ "$delta" =~ ^[0-9a-f]{40}$ ]]; then
            read -r status ahead < <(gh api "repos/ferrum-edge/ferrum-edge/compare/$delta...$edge_head" \
              --jq '"\(.status) \(.ahead_by)"')
            case "$status" in
              identical) delta_note="read at Edge main's head" ;;
              ahead) delta_note="read $ahead commit(s) before Edge main's head; newer changes may not be recorded yet" ;;
              *) delta_note="not on Edge main's history ($status)" ;;
            esac
          else
            delta="none"
            delta_note="ferrum-contracts main records no main_branch_delta in gateway-errors.json"
          fi
          {
            echo "contracts=$contracts"
            echo "edge-head=$edge_head"
            echo "delta=$delta"
            echo "delta-note=$delta_note"
            echo "missing=${missing# }"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"
          echo "Checking Anvil against ferrum-contracts main at $contracts (Edge main $edge_head)."

      - name: Run the contract parity tests against ferrum-contracts main
        id: parity
        continue-on-error: true
        env:
          ANVIL_CONTRACTS_MAIN_DIR: ${{ steps.contracts.outputs.dir }}
        run: cargo test --locked -p anvil-diagnostics --test contracts_adoption -- --ignored contracts_main

      - name: Write the report
        id: report
        env:
          CONTRACTS: ${{ steps.contracts.outputs.contracts }}
          EDGE_HEAD: ${{ steps.contracts.outputs.edge-head }}
          DELTA: ${{ steps.contracts.outputs.delta }}
          DELTA_NOTE: ${{ steps.contracts.outputs.delta-note }}
          MISSING: ${{ steps.contracts.outputs.missing }}
          DIR: ${{ steps.contracts.outputs.dir }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          set -euo pipefail
          outcome=clean
          parity=pass
          files=pass
          if [ "$PARITY" != success ]; then outcome=drift; parity="**FAIL**"; fi
          if [ -n "$MISSING" ]; then outcome=drift; files="**FAIL**: missing on main: \`$MISSING\`"; fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          report="$RUNNER_TEMP/edge-main-drift.md"
          {
            echo "<!-- edge-main-drift -->"
            if [ "$outcome" = drift ]; then
              echo "\`$GITHUB_REPOSITORY\` fails its contract parity checks against ferrum-contracts \`main\`, which records what Ferrum Edge \`main\` changes. This is an early warning: the change is not released yet, so there is time to ship a compatible Anvil release before Edge releases it."
            else
              echo "\`$GITHUB_REPOSITORY\` passes its contract parity checks against ferrum-contracts \`main\`."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ferrum-contracts \`main\` | [\`${CONTRACTS:0:12}\`](https://github.com/ferrum-edge/ferrum-contracts/commit/$CONTRACTS) |"
            echo "| \`main_branch_delta\` (gateway errors) | \`${DELTA:0:12}\`: $DELTA_NOTE |"
            echo "| Edge \`main\` | \`${EDGE_HEAD:0:12}\` |"
            echo "| Run | $run_url |"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Every vendored contract file exists on ferrum-contracts \`main\` | $files |"
            echo "| Error and header vocabularies, \`DiagnosticFinding\` schema and diagnostic-ref contract against Anvil (\`contracts_main_*\` tests) | $parity |"
            for vocabulary in gateway-errors gateway-headers; do
              summary=$(jq -r '.main_branch_delta.summary // empty' "$DIR/vocabularies/$vocabulary.json" 2>/dev/null || true)
              if [ -n "$summary" ]; then
                echo
                echo "<details><summary><code>$vocabulary</code> main_branch_delta summary (for review)</summary>"
                echo
                echo '```text'
                printf '%s\n' "$summary" | head -c 6000
                echo
                echo '```'
                echo
                echo "</details>"
              fi
            done
            echo
            echo "The run log names each failing assertion. A clean scheduled run closes this issue."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "outcome=$outcome"
            echo "report=$(base64 -w0 "$report")"
          } >> "$GITHUB_OUTPUT"

  issue:
    name: Edge main drift issue
    needs: check
    # Checks out and runs nothing, never for pull requests, and only for the
    # default branch's own checks.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.check.outputs.outcome }}
          CONTRACTS: ${{ needs.check.outputs.contracts-commit }}
          REPORT: ${{ needs.check.outputs.report }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          label=edge-main-drift
          title="Edge main drift: Anvil fails its contract parity checks against ferrum-contracts main"
          base64 -d <<< "$REPORT" > "$RUNNER_TEMP/report.md"
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$label&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | sort_by(.number) | .[0].number // empty')
          case "$OUTCOME" in
            drift)
              gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 \
                --description "Fails its checks against unreleased Ferrum Edge main" --force
              if [ -n "$number" ]; then
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
                  --body "Still failing against ferrum-contracts main at \`${CONTRACTS:0:12}\`: $run_url"
                echo "::notice::Updated tracking issue #$number."
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" \
                  --body-file "$RUNNER_TEMP/report.md"
                echo "::notice::Opened a tracking issue."
              fi
              echo "::error::Anvil fails its contract parity checks against ferrum-contracts main at $CONTRACTS; see the tracking issue."
              exit 1
              ;;
            clean)
              if [ -n "$number" ]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                  --comment "Clean against ferrum-contracts main at \`${CONTRACTS:0:12}\`: $run_url"
                echo "::notice::Closed tracking issue #$number."
              fi
              ;;
            *)
              echo "::error::Unexpected check outcome: $OUTCOME"
              exit 1
              ;;
          esac
