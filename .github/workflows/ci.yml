# Fast PR/push lane: formatting, lints, unit/contract/integration tests on
# Linux/macOS/Windows, renderer tests and build, contract and diagnostic
# catalog drift, supply-chain policy and secret scanning.
# Reproduce locally: see docs/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Line tables only (not full variable/type debug info) for dev and test
  # builds: backtraces keep file:line, while compiling, linking (slowest on
  # Windows) and the cached target directory get much cheaper.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: rust
      # anvil-desktop embeds apps/desktop/dist at compile time
      # (tauri::generate_context!), so the frontend must be built first.
      - name: Build frontend (for anvil-desktop compilation)
        working-directory: apps/desktop
        run: npm run build
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo check anvil-desktop (release feature set)
        run: cargo check --locked -p anvil-desktop
      - name: cargo check anvil-desktop --features e2e (test-only WebDriver build)
        run: cargo check --locked -p anvil-desktop --features e2e
      - name: cargo test (workspace except the desktop shell)
        shell: bash
        run: |
          ulimit -n 4096 2>/dev/null || true
          # Every failing test binary is reported in one run, not just the first.
          cargo test --locked --workspace --exclude anvil-desktop --no-fail-fast
      # The desktop shell's own unit tests (no window is created). Not on
      # Windows: tauri-build embeds the common-controls manifest only in the app
      # binary, and a test binary linking the dialog plugin fails to load without it.
      - name: cargo test anvil-desktop (unit tests)
        if: runner.os != 'Windows'
        run: cargo test --locked -p anvil-desktop --lib
      # Keychain profiles ("Start now — no password") against the real OS
      # credential store on every platform. Linux needs a Secret Service: run
      # gnome-keyring, unlocked, inside a private D-Bus session.
      - name: OS credential store round trip (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "anvil-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --locked -p anvil-storage --test os_keychain -- --ignored'
      - name: OS credential store round trip (macOS Keychain / Windows Credential Manager)
        if: runner.os != 'Linux'
        run: cargo test --locked -p anvil-storage --test os_keychain -- --ignored

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Typecheck (native E2E suite)
        run: npm run e2e:typecheck
      - name: Renderer unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high

  contracts:
    name: Contract & catalog drift
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tauri-deps: "false"
          cache-key: contracts
      - name: Regenerate JSON Schemas (anvil schema)
        run: cargo run --locked -p anvil-cli -- schema --out contracts/schemas
      - name: Regenerate TypeScript bindings
        working-directory: apps/desktop
        run: npm run contracts
      - name: Fail on drift
        run: |
          git add -N contracts apps/desktop/src/generated
          if ! git diff --exit-code --stat -- contracts apps/desktop/src/generated; then
            echo "::error::Generated contracts are stale. Run 'cargo run -p anvil-cli -- schema --out contracts/schemas' and 'npm run contracts' (apps/desktop), then commit."
            git diff -- contracts apps/desktop/src/generated | head -200
            exit 1
          fi
      - name: Diagnostic catalog drift (finding codes ⇄ catalog wording)
        run: cargo test --locked -p anvil-diagnostics --test catalog_drift

  supply-chain:
    name: Supply chain & licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tauri-deps: "false"
          node: "false"
          cache-key: supply-chain
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny --locked check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: THIRD_PARTY_LICENSES.md is current and every license is allowed
        run: node scripts/licenses.mjs --check
      - name: Release dependency graph has no WebDriver plugin / e2e feature
        run: scripts/release-check.sh

  release-check:
    name: Release checker · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trusted AppImage extraction and fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc python3 squashfs-tools
      # Keep this source pin and recipe aligned in ci.yml and both release.yml jobs.
      # Primary provenance and upstream security notes: docs/release.md.
      - name: Trusted AppImage extractor (pinned source, hosted build only)
        shell: bash
        env:
          SQUASHFS_TOOLS_VERSION: 4.7.5
          SQUASHFS_TOOLS_RELEASE_DATE: 2026/03/01
          SQUASHFS_TOOLS_SHA256: 547b7b7f4d2e44bf91b6fc554664850c69563701deab9fd9cd7e21f694c88ea6
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::Extractor provisioning requires a GitHub-hosted runner"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl \
            liblz4-dev liblzma-dev liblzo2-dev libzstd-dev zlib1g-dev
          extractor_source="$(mktemp -d "$RUNNER_TEMP/anvil-squashfs-tools.XXXXXX")"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
            --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$extractor_source/source.tar.gz" \
            "https://github.com/plougher/squashfs-tools/releases/download/$SQUASHFS_TOOLS_VERSION/squashfs-tools-$SQUASHFS_TOOLS_VERSION.tar.gz"
          echo "$SQUASHFS_TOOLS_SHA256  $extractor_source/source.tar.gz" | sha256sum --check --strict -
          tar -xzf "$extractor_source/source.tar.gz" -C "$extractor_source" --no-same-owner
          extractor_build="$extractor_source/squashfs-tools-$SQUASHFS_TOOLS_VERSION/squashfs-tools"
          make -C "$extractor_build" -j2 unsquashfs LZMA_XZ_SUPPORT=1
          mkdir "$extractor_source/bin"
          install -m 0755 "$extractor_build/unsquashfs" "$extractor_source/bin/unsquashfs"
          version_status=0
          banner="$(LC_ALL=C "$extractor_source/bin/unsquashfs" -version)" || version_status=$?
          expected="unsquashfs version $SQUASHFS_TOOLS_VERSION ($SQUASHFS_TOOLS_RELEASE_DATE)"
          # Upstream -version exits 1 without an input filesystem; other errors fail closed.
          if [ "$version_status" -gt 1 ] || [ "${banner%%$'\n'*}" != "$expected" ]; then
            echo "::error::Unexpected pinned unsquashfs version banner/status"
            exit 1
          fi
          printf '%s\n' "$banner"
          echo "$extractor_source/bin" >> "$GITHUB_PATH"
      - name: AppImage inspection and explicit runtime-probe regressions
        run: python3 -I scripts/tests/test_release_check.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      # Scan only the ancestry of the checked-out commit (a PR's merge commit,
      # or main on push), not every fetched branch: a fixture in another open
      # PR must not fail this one. The options are gitleaks' default
      # `git log` arguments with `--all` replaced by `HEAD`.
      - name: gitleaks (full history of HEAD)
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="--full-history --diff-filter=tuxdb HEAD" --redact --no-banner --verbose .'
      - name: gitleaks (working tree, including untracked generated files)
        run: '"$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --verbose .'
