# REL-003 (signed update integrity) against a built desktop bundle: the
# AppImage on Linux, the .app on macOS, and the NSIS and the MSI installs on
# Windows (installed silently first; there the plugin starts the update
# installer and exits the app, and the installer restarts it), built with the test-only `e2e`
# feature (embedded WebDriver), a minisign key generated for the run and a
# loopback update endpoint. Only `plugins.updater.pubkey`, its endpoint (plain
# HTTP on 127.0.0.1) and, for the update build, the version and
# `createUpdaterArtifacts` differ from the shipped config; `requireSignedVersion`
# stays on. WebdriverIO calls the app's real `update_install` command
# (apps/desktop/e2e/updater/):
#   run 1  an update signed by another key, one with a corrupted signature and
#          one altered after signing are refused; bundle, version and profile unchanged
#   run 2  relaunched, the bundle is unchanged; a validly signed update installs
#   run 3  relaunched, the bundle reports the updated version
# Two bundle builds per OS make this slow, so it runs only when the update
# path, its tests or this workflow change, weekly, and on demand.
name: Updater E2E

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/src/cmd_update.rs"
      - "apps/desktop/src-tauri/src/cmd_update/**"
      # Registers the updater plugin and the update commands.
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/tauri.conf.json"
      # The NSIS template the Windows lanes install and update through.
      - "apps/desktop/src-tauri/windows/installer.nsi"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/e2e/updater/**"
      - "apps/desktop/e2e/helpers.ts"
      - "apps/desktop/wdio.conf.ts"
      - "scripts/updater-manifest.mjs"
      - "scripts/tests/updater-manifest.test.mjs"
      - ".github/workflows/updater-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/src/cmd_update.rs"
      - "apps/desktop/src-tauri/src/cmd_update/**"
      # Registers the updater plugin and the update commands.
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/tauri.conf.json"
      # The NSIS template the Windows lanes install and update through.
      - "apps/desktop/src-tauri/windows/installer.nsi"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/e2e/updater/**"
      - "apps/desktop/e2e/helpers.ts"
      - "apps/desktop/wdio.conf.ts"
      - "scripts/updater-manifest.mjs"
      - "scripts/tests/updater-manifest.test.mjs"
      - ".github/workflows/updater-e2e.yml"
  # Weekly, so Cargo.lock bumps of tauri-plugin-updater are covered too.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Smaller debug bundles (the update artifact is downloaded into memory).
  CARGO_PROFILE_DEV_DEBUG: "0"
  UPDATE_PORT: "18797"

jobs:
  updater-e2e:
    name: Updater E2E · ${{ matrix.os }} · ${{ matrix.bundles }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            bundles: appimage
          - os: macos-15
            bundles: app
          - os: windows-2025
            bundles: nsis
          - os: windows-2025
            bundles: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BUNDLES: ${{ matrix.bundles }}
      # Windows: which install the updater replaces (its latest.json key).
      ANVIL_E2E_UPDATE_BUNDLE: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          xvfb: "true"
          cache-key: updater-e2e
      # Supporting checks of the release manifest's signature verification
      # (also in ci.yml's Supply chain job).
      - name: Updater signature verifier tests (latest.json)
        run: node --test scripts/tests/updater-manifest.test.mjs
      - name: AppImage bundling tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2

      - name: Test updater keys and build configs
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rel003"
          mkdir -p "$work/keys" "$work/fixtures" "$work/install" "$work/sign"
          # Throw-away keys for this run only; nothing here is a release key.
          pw="$(openssl rand -hex 16)"
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "::add-mask::$pass"
          npx tauri signer generate --ci -p "$pw" -w "$work/keys/updater.key" -f > /dev/null
          npx tauri signer generate --ci -p "$pw" -w "$work/keys/other.key" -f > /dev/null
          # The offered version: newer than the shipped one whatever that is
          # (the next major), so the updater sees an update at 0.x and at 1.x alike.
          OFFERED="$(node -p 'const [m] = require("./src-tauri/tauri.conf.json").version.split("."); `${Number(m) + 1}.0.0`')"
          export OFFERED
          PUBKEY="$(tr -d '[:space:]' < "$work/keys/updater.key.pub")" WORK="$work" node -e '
            const fs = require("node:fs");
            const shipped = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater;
            if (shipped.requireSignedVersion !== true) throw new Error("the shipped updater config must require a signed version");
            // HTTPS, as a real endpoint: the test CA is added to the system trust store below.
            const updater = { pubkey: process.env.PUBKEY, endpoints: [`https://127.0.0.1:${process.env.UPDATE_PORT}/latest.json`] };
            const base = { plugins: { updater } };
            const update = { version: process.env.OFFERED, bundle: { createUpdaterArtifacts: true }, plugins: { updater } };
            fs.writeFileSync(`${process.env.WORK}/base.json`, JSON.stringify(base));
            fs.writeFileSync(`${process.env.WORK}/update.json`, JSON.stringify(update));
          '
          # The endpoint's TLS certificate (127.0.0.1) from a test CA the next
          # step adds to the system trust store, and one from a CA nobody trusts.
          mkdir -p "$work/tls"
          # Config files, not -subj/-addext: the same commands work with OpenSSL,
          # LibreSSL (macOS) and Git Bash (no path conversion of "/CN=").
          leaf_ext="$work/tls/leaf.ext"
          printf 'subjectAltName=IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nauthorityKeyIdentifier=keyid\n' > "$leaf_ext"
          printf '[req]\nprompt=no\ndistinguished_name=dn\n[dn]\nCN=127.0.0.1\n' > "$work/tls/leaf.cnf"
          for ca in trusted untrusted; do
            printf '[req]\nprompt=no\ndistinguished_name=dn\n[dn]\nCN=Anvil REL-003 %s test CA\n[v3_ca]\nbasicConstraints=critical,CA:TRUE\nkeyUsage=critical,keyCertSign,cRLSign\nsubjectKeyIdentifier=hash\n' "$ca" > "$work/tls/$ca-ca.cnf"
            openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout "$work/tls/$ca-ca.key" -out "$work/tls/$ca-ca.pem" -config "$work/tls/$ca-ca.cnf" -extensions v3_ca 2> /dev/null
            openssl req -new -newkey rsa:2048 -nodes -keyout "$work/tls/$ca-leaf.key" -out "$work/tls/$ca-leaf.csr" -config "$work/tls/leaf.cnf" 2> /dev/null
            openssl x509 -req -in "$work/tls/$ca-leaf.csr" -CA "$work/tls/$ca-ca.pem" -CAkey "$work/tls/$ca-ca.key" -CAcreateserial -days 30 \
              -extfile "$leaf_ext" -out "$work/tls/$ca-leaf.pem" 2> /dev/null
            openssl verify -CAfile "$work/tls/$ca-ca.pem" "$work/tls/$ca-leaf.pem"
          done
          cp "$work/tls/trusted-leaf.pem" "$work/fixtures/tls-cert.pem"
          cp "$work/tls/trusted-leaf.key" "$work/fixtures/tls-key.pem"
          cp "$work/tls/untrusted-leaf.pem" "$work/fixtures/untrusted-cert.pem"
          cp "$work/tls/untrusted-leaf.key" "$work/fixtures/untrusted-key.pem"
          {
            echo "REL003=$work"
            echo "REL003_KEY_PASSWORD=$pw"
            echo "ANVIL_E2E_PASSPHRASE=$pass"
            echo "OFFERED=$OFFERED"
            echo "ANVIL_E2E_UPDATE_OFFERED=$OFFERED"
          } >> "$GITHUB_ENV"

      - name: Trust the test CA (system trust store)
        shell: bash
        run: |
          set -euo pipefail
          ca="$REL003/tls/trusted-ca.pem"
          case "$RUNNER_OS" in
            Linux) sudo cp "$ca" /usr/local/share/ca-certificates/anvil-rel003-test-ca.crt && sudo update-ca-certificates ;;
            macOS) sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$ca" ;;
            Windows) certutil -addstore -f Root "$(cygpath -w "$ca")" ;;
          esac

      # The newest published release's latest.json: its shape is checked (the
      # platform keys Anvil publishes, asset URLs of that tag, signatures by the
      # owner's key recording its version), and every manifest the specs serve
      # copies it.
      - name: Published latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_PUBKEY: ${{ vars.ANVIL_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$REL003/published" --clobber
          cp "$REL003/published/latest.json" "$REL003/fixtures/published-latest.json"
          TAG="$tag" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { checkPublishedManifest } from "./scripts/updater-manifest.mjs";
            const manifest = JSON.parse(readFileSync(`${process.env.REL003}/fixtures/published-latest.json`, "utf8"));
            const tag = process.env.TAG;
            const keys = checkPublishedManifest(manifest, { repo: process.env.GITHUB_REPOSITORY, tag, version: tag.replace(/^anvil-v/, ""), pubkey: process.env.OWNER_PUBKEY.trim() });
            console.log(`${tag}: latest.json has ${keys.join(", ")}, each signed by the owner key for its version`);
          '

      - name: Build the installed bundle (shipped version, e2e feature, test key)
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf ../../target/debug/bundle
          npx tauri build --ci --debug --features e2e --bundles "$BUNDLES" --config "$REL003/base.json"
          if [ "$RUNNER_OS" = Windows ]; then
            shopt -s nullglob
            if [ "$BUNDLES" = nsis ]; then found=(../../target/debug/bundle/nsis/*-setup.exe); else found=(../../target/debug/bundle/msi/*.msi); fi
            [ "${#found[@]}" = 1 ] || { echo "::error::expected one $BUNDLES installer, found ${#found[@]}"; exit 1; }
            cp "${found[0]}" "$REL003/install/"
            # Installed silently by the next step; it sets ANVIL_E2E_APP and ANVIL_E2E_UPDATE_INSTALLED.
            echo "REL003_INSTALLER=$REL003/install/$(basename "${found[0]}")" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            shopt -s nullglob; found=(../../target/debug/bundle/appimage/*.AppImage)
            [ "${#found[@]}" = 1 ] || { echo "::error::expected one AppImage, found ${#found[@]}"; exit 1; }
            installed="$REL003/install/Ferrum Anvil.AppImage"
            cp "${found[0]}" "$installed"
            chmod 755 "$installed"
            app="$installed"
          else
            shopt -s nullglob; found=(../../target/debug/bundle/macos/*.app)
            [ "${#found[@]}" = 1 ] || { echo "::error::expected one .app, found ${#found[@]}"; exit 1; }
            cp -R "${found[0]}" "$REL003/install/"
            installed="$REL003/install/$(basename "${found[0]}")"
            app="$installed/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$installed/Contents/Info.plist")"
          fi
          [ -x "$app" ] || { echo "::error::$app is not executable"; exit 1; }
          { echo "ANVIL_E2E_UPDATE_INSTALLED=$installed"; echo "ANVIL_E2E_APP=$app"; } >> "$GITHUB_ENV"
          ls -la "$REL003/install"

      - name: Install the installed bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A Windows path (the bash steps write it with forward slashes, which
          # msiexec refuses with 1619, "could not be opened").
          $installer = [IO.Path]::GetFullPath($env:REL003_INSTALLER)
          if ($env:BUNDLES -eq "nsis") {
            $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          } else {
            $log = Join-Path $env:REL003 "install/msiexec.log"
            $p = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
          }
          if ($p.ExitCode -ne 0) { throw "the $($env:BUNDLES) installer exited with $($p.ExitCode)" }
          # Per user (NSIS) or per machine (MSI), as the installers default to.
          $dir = if ($env:BUNDLES -eq "nsis") { Join-Path $env:LOCALAPPDATA 'Ferrum Anvil' } else { Join-Path $env:ProgramFiles 'Ferrum Anvil' }
          # The app's executable, not the uninstaller (release-smoke finds it the same way).
          $exe = Get-ChildItem -LiteralPath $dir -Filter '*.exe' -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch '^(uninstall|unins)' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Get-ChildItem -Recurse -LiteralPath $dir -ErrorAction SilentlyContinue | Out-Host; throw "no app executable in $dir after the install" }
          "ANVIL_E2E_UPDATE_INSTALLED=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "ANVIL_E2E_APP=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem -LiteralPath $dir | Out-Host
          (Get-Item -LiteralPath $exe).VersionInfo | Format-List ProductVersion, FileVersion | Out-Host

      - name: Build the update bundle (offered version, signed updater artifact)
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf ../../target/debug/bundle
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$REL003/keys/updater.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$REL003_KEY_PASSWORD" \
            npx tauri build --ci --debug --features e2e --bundles "$BUNDLES" --config "$REL003/update.json"
          shopt -s nullglob
          if [ "$RUNNER_OS" = Windows ]; then
            if [ "$BUNDLES" = nsis ]; then found=(../../target/debug/bundle/nsis/*_"$OFFERED"_*-setup.exe); else found=(../../target/debug/bundle/msi/*_"$OFFERED"_*.msi); fi
          elif [ "$RUNNER_OS" = Linux ]; then
            found=(../../target/debug/bundle/appimage/*_"$OFFERED"_*.AppImage)
          else
            found=(../../target/debug/bundle/macos/*.app.tar.gz)
            apps=(../../target/debug/bundle/macos/*.app)
            cp -R "${apps[0]}" "$REL003/fixtures/expected.app"
          fi
          [ "${#found[@]}" = 1 ] || { echo "::error::expected one updater artifact, found ${#found[@]}"; exit 1; }
          [ -f "${found[0]}.sig" ] || { echo "::error::${found[0]} has no signature"; exit 1; }
          cp "${found[0]}" "$REL003/fixtures/update.bin"
          cp "${found[0]}.sig" "$REL003/fixtures/update.sig"
          ls -la "$REL003/fixtures"

      - name: Signatures for the refusal cases
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          # The control signature verifies against the compiled-in key and
          # records the offered version (the release manifest's own checks).
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { checkSignedVersion, verifyUpdaterSignature } from "../../scripts/updater-manifest.mjs";
            const f = (n) => readFileSync(`${process.env.REL003}/${n}`);
            const pubkey = f("keys/updater.key.pub").toString().replace(/\s/g, "");
            checkSignedVersion(verifyUpdaterSignature(f("fixtures/update.bin"), f("fixtures/update.sig").toString(), pubkey), process.env.OFFERED);
            console.log("control signature verifies and records", process.env.OFFERED);
          '
          # The same artifact signed by another key, for the same version.
          cp "$REL003/fixtures/update.bin" "$REL003/sign/wrong-key.bin"
          npx tauri signer sign -f "$REL003/keys/other.key" -p "$REL003_KEY_PASSWORD" --app-version "$OFFERED" "$REL003/sign/wrong-key.bin" > /dev/null
          cp "$REL003/sign/wrong-key.bin.sig" "$REL003/fixtures/wrong-key.sig"

      - name: Run 1 — tampered updates are refused
        shell: bash
        working-directory: apps/desktop
        env:
          ANVIL_DATA_DIR: ${{ runner.temp }}/rel003/data
          ANVIL_E2E_PROFILE: REL-003 E2E
          ANVIL_E2E_UPDATE_FIXTURES: ${{ runner.temp }}/rel003/fixtures
          ANVIL_E2E_UPDATE_PORT: ${{ env.UPDATE_PORT }}
          # The AppImage runtime extracts and runs it (no FUSE), and still sets APPIMAGE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          stop_app() { if [ "$RUNNER_OS" = Windows ]; then taskkill //IM "$(basename "$ANVIL_E2E_APP")" //F //T >/dev/null 2>&1 || true; else pkill -f anvil-desktop || true; pkill -f "$ANVIL_E2E_APP" || true; fi; sleep 2; }
          trap stop_app EXIT
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args="-screen 0 1600x1000x24" npx wdio run ./wdio.conf.ts --spec ./e2e/updater/rel003-1-refusal.e2e.ts
          else npx wdio run ./wdio.conf.ts --spec ./e2e/updater/rel003-1-refusal.e2e.ts; fi

      - name: Run 2 — the relaunched bundle is unchanged; a valid update installs
        shell: bash
        working-directory: apps/desktop
        env:
          ANVIL_DATA_DIR: ${{ runner.temp }}/rel003/data
          ANVIL_E2E_PROFILE: REL-003 E2E
          ANVIL_E2E_UPDATE_FIXTURES: ${{ runner.temp }}/rel003/fixtures
          ANVIL_E2E_UPDATE_PORT: ${{ env.UPDATE_PORT }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          stop_app() { if [ "$RUNNER_OS" = Windows ]; then taskkill //IM "$(basename "$ANVIL_E2E_APP")" //F //T >/dev/null 2>&1 || true; else pkill -f anvil-desktop || true; pkill -f "$ANVIL_E2E_APP" || true; fi; sleep 2; }
          trap stop_app EXIT
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args="-screen 0 1600x1000x24" npx wdio run ./wdio.conf.ts --spec ./e2e/updater/rel003-2-install.e2e.ts
          else npx wdio run ./wdio.conf.ts --spec ./e2e/updater/rel003-2-install.e2e.ts; fi

      - name: Run 3 — the relaunched bundle runs the update
        shell: bash
        working-directory: apps/desktop
        env:
          ANVIL_DATA_DIR: ${{ runner.temp }}/rel003/data
          ANVIL_E2E_PROFILE: REL-003 E2E
          ANVIL_E2E_UPDATE_FIXTURES: ${{ runner.temp }}/rel003/fixtures
          ANVIL_E2E_UPDATE_PORT: ${{ env.UPDATE_PORT }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          stop_app() { if [ "$RUNNER_OS" = Windows ]; then taskkill //IM "$(basename "$ANVIL_E2E_APP")" //F //T >/dev/null 2>&1 || true; else pkill -f anvil-desktop || true; pkill -f "$ANVIL_E2E_APP" || true; fi; sleep 2; }
          trap stop_app EXIT
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args="-screen 0 1600x1000x24" npx wdio run ./wdio.conf.ts --spec ./e2e/updater/rel003-3-installed.e2e.ts
          else npx wdio run ./wdio.conf.ts --spec ./e2e/updater/rel003-3-installed.e2e.ts; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-e2e-screenshots-${{ matrix.os }}-${{ matrix.bundles }}-${{ github.run_id }}
          path: apps/desktop/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30
