# Release lane: build installers and CLI binaries per OS/arch from a tag,
# prove they contain no test hooks, generate checksums, SBOMs, a license
# report and release evidence, and create a DRAFT GitHub release whose body is
# already the final release notes (scripts/release-notes.mjs, from CHANGELOG.md).
#
#   push tag anvil-vX.Y.Z             -> full build + draft release
#   manual from a tag, dry_run=false  -> full build + draft release
#   manual with dry_run=true          -> unsigned artifacts + evidence uploaded to the run only
#
# Signing runs only for a tagged release: its build jobs run in the protected
# `release` environment, which should hold the owner's credentials (Apple and
# Windows code signing, TAURI_SIGNING_PRIVATE_KEY for the updater), and the
# workflow passes none of them to a dry run. They reach only the bundle step,
# never the compile step. Which signing route each platform takes is chosen
# from which secrets and variables exist (the "Signing route" step):
#   macOS:   Developer ID certificate + notarization with an App Store Connect
#            API key (preferred) or an Apple ID app-specific password
#   Windows: Azure Artifact Signing through Tauri's bundle.windows.signCommand
#            (OIDC or client secret; preferred) or an exportable .pfx
# With none configured a platform builds unsigned, as before. A half-configured
# route fails the run, and so does a configured route whose signature (or
# notarization) does not verify: a release never ships unsigned by accident.
# A target is recorded as signed only after the signature is verified on the
# runner; otherwise it is "unsigned — owner credentials not configured".
# Signed updater artifacts and latest.json also need the variable
# ANVIL_UPDATER_PUBKEY. See docs/release.md.
name: Release

on:
  push:
    tags: ["anvil-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and inspect artifacts without creating a GitHub release (default)"
        required: false
        type: boolean
        default: true
      tag:
        description: "Tag to validate for a non-dry-run release (anvil-vX.Y.Z); run the workflow from that tag"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      commit: ${{ steps.version.outputs.commit }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The fully qualified ref of the run: a bare tag name would resolve to
          # a branch of the same name if one exists.
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Resolve version, tag and commit
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          app="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          ui="$(node -p 'require("./apps/desktop/package.json").version')"
          [ "$version" = "$app" ] && [ "$version" = "$ui" ] || { echo "::error::version mismatch: Cargo $version, tauri.conf $app, package.json $ui"; exit 1; }
          source_tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then source_tag="${GITHUB_REF_NAME}"; fi
          if [ -n "$INPUT_TAG" ]; then
            if [ "$GITHUB_REF" != "refs/tags/$INPUT_TAG" ]; then
              echo "::error::run the workflow from the tag itself (Use workflow from: $INPUT_TAG); it runs from $GITHUB_REF"; exit 1
            fi
            source_tag="$INPUT_TAG"
          fi
          if [ -n "$source_tag" ] && ! git rev-parse -q --verify "refs/tags/$source_tag" >/dev/null; then
            echo "::error::refs/tags/$source_tag does not exist"; exit 1
          fi
          if [ -n "$source_tag" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$source_tag^{commit}")" ]; then
            echo "::error::HEAD $(git rev-parse HEAD) is not the commit of $source_tag"; exit 1
          fi
          if [ -n "$source_tag" ] && [ "$source_tag" != "anvil-v$version" ]; then
            echo "::error::tag $source_tag does not match workspace version $version (expected anvil-v$version)"; exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ -z "$source_tag" ]; then
            echo "::error::a non-dry-run release must start from a tag"; exit 1
          fi
          tag="$source_tag"
          if [ "$DRY_RUN" = "true" ]; then tag=""; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            # Build and publish check out this exact commit, never a name.
            echo "ref=$(git rev-parse HEAD)"
            echo "commit=$(git rev-parse HEAD)"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, tag '${tag:-<dry run>}', commit $(git rev-parse HEAD)"
      - name: CHANGELOG.md has release notes for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs --version "$VERSION" --check
      - uses: ./.github/actions/setup
        with:
          tauri-deps: "false"
          node: "false"
          cache-key: release-preflight
          # A failed release run never writes the build cache.
          cache-on-failure: "false"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check
      - name: License inventory current and allowed
        run: node scripts/licenses.mjs --check
      - name: Release graph has no WebDriver plugin / e2e feature
        run: scripts/release-check.sh
      - name: Trusted AppImage extraction and fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc python3 squashfs-tools
      - name: Trusted AppImage extractor (pinned source, hosted build only)
        uses: ./.github/actions/trusted-appimage-extractor
      - name: AppImage inspection and explicit runtime-probe regressions
        run: python3 -I scripts/tests/test_release_check.py
      - name: Diagnostic catalog drift
        run: cargo test --locked -p anvil-diagnostics --test catalog_drift

  build:
    name: Build · ${{ matrix.target }}
    needs: preflight
    # A tagged release runs in the protected `release` environment (required
    # reviewers, anvil-v* deployment rule; the updater key lives there). A dry
    # run uses no environment and never sees the updater key.
    environment: ${{ needs.preflight.outputs.tag != '' && 'release' || '' }}
    permissions:
      contents: read
      # Azure Artifact Signing's OIDC login (azure/login). The Entra ID
      # federated credential trusts only this repository's `release`
      # environment, so a token minted by a dry run (no environment) is refused.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            bundles: app,dmg
            probe: true
          - target: x86_64-apple-darwin
            os: macos-15
            bundles: app,dmg
            probe: false # cross-built on arm64; not launched
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04 # modern Linux baseline for the .deb/.rpm/AppImage
            bundles: deb,rpm,appimage
            probe: true
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            bundles: msi,nsis
            probe: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
      - name: Checked out the preflight commit
        shell: bash
        env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: '[ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::HEAD $(git rev-parse HEAD) is not the preflight commit $COMMIT"; exit 1; }'
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.target }}
          xvfb: "true"
          cache-key: release-${{ matrix.target }}
          # A failed release run never writes the build cache.
          cache-on-failure: "false"
      - name: Bundling and inspection tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2 rpm2cpio cpio libarchive-tools python3 squashfs-tools
      - name: Trusted AppImage extractor (pinned source, hosted build only)
        uses: ./.github/actions/trusted-appimage-extractor
        if: runner.os == 'Linux'
      - name: Pinned linuxdeploy for the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # Tauri CLI 2.12 bundles the AppImage with tauri-apps/binary-releases'
          # `linuxdeploy-07333c6` build (tauri-apps/tauri#16062), whose
          # excludelist knows libwayland-client.so.0 (CLI 2.11's July 2024
          # build copied the host's into the AppImage, and a host Mesa built
          # against a newer libwayland then could not load its EGL driver:
          # WebKit's web process aborted with EGL_BAD_PARAMETER). The CLI picks
          # that release by tag only and downloads it unverified unless
          # `linuxdeploy-07333c6-x86_64.AppImage` is already in its tool cache,
          # so this step places it there after a SHA-256 check. Update the file
          # name and hash together with a CLI that pins another build.
          LINUXDEPLOY_URL: https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_SHA256: 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
          LINUXDEPLOY_CACHED: linuxdeploy-07333c6-x86_64.AppImage
        run: |
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
            --silent --show-error --retry 3 --connect-timeout 15 --max-time 300 \
            --output "$tools/linuxdeploy-download" "$LINUXDEPLOY_URL"
          echo "$LINUXDEPLOY_SHA256  $tools/linuxdeploy-download" | sha256sum --check --strict -
          mv "$tools/linuxdeploy-download" "$tools/$LINUXDEPLOY_CACHED"
          chmod 0755 "$tools/$LINUXDEPLOY_CACHED"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Updater config (tagged release with the owner's updater key only)
        id: updater
        shell: bash
        env:
          ANVIL_UPDATER_PUBKEY: ${{ vars.ANVIL_UPDATER_PUBKEY }}
          # Whether the key exists, never the key itself.
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          # Signed updater artifacts need both halves of the owner's updater key
          # and a real tag: dry runs never sign updates. The public key is
          # compiled into the app, so build and bundle both get this config.
          # One normalized key (all whitespace stripped) is compiled in and recorded.
          pubkey="$(tr -d '[:space:]' <<<"${ANVIL_UPDATER_PUBKEY:-}")"
          if [ -n "$TAG" ] && [ "$HAS_KEY" = "true" ] && [ -n "$pubkey" ]; then
            cfg="$RUNNER_TEMP/anvil-updater.conf.json"
            PUBKEY="$pubkey" node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.PUBKEY } } }))' "$cfg"
            { echo "updater=true"; echo "config=$cfg"; echo "pubkey=$pubkey"; } >> "$GITHUB_OUTPUT"
            echo "Updater key configured; creating signed updater artifacts."
          else
            if [ -z "$TAG" ]; then
              echo "Dry run: no updater artifacts."
            elif [ "$HAS_KEY" = "true" ] || [ -n "$pubkey" ]; then
              echo "::warning::only one of TAURI_SIGNING_PRIVATE_KEY / ANVIL_UPDATER_PUBKEY is set; building without updater artifacts"
            fi
            { echo "updater=false"; echo "config="; echo "pubkey="; } >> "$GITHUB_OUTPUT"
          fi

      - name: Signing route (tagged release only; reads whether secrets exist, never their values)
        id: route
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID != '' }}
          HAS_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT != '' }}
          HAS_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
          HAS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE != '' }}
        run: |
          # Every platform's configuration is checked on every target, so a
          # half-configured route fails the whole run before anything is built.
          present() { local n v out=(); for n in "$@"; do v="HAS_$n"; [ "${!v}" = "true" ] && out+=("$n"); done; echo "${out[*]}"; }
          missing() { local n v out=(); for n in "$@"; do v="HAS_$n"; [ "${!v}" = "true" ] || out+=("$n"); done; echo "${out[*]}"; }
          fail() { echo "::error::$1"; exit 1; }
          macos=none; windows=none
          if [ -z "$TAG" ]; then
            echo "Dry run: no signing credential is read; every target builds unsigned."
          else
            apple_cert=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD)
            apple_api=(APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8)
            apple_id=(APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
            any="$(present "${apple_cert[@]}" APPLE_SIGNING_IDENTITY "${apple_api[@]}" "${apple_id[@]}")"
            if [ -n "$any" ]; then
              m="$(missing "${apple_cert[@]}")"; [ -z "$m" ] || fail "macOS signing is partly configured (set: $any); missing: $m"
              api="$(present "${apple_api[@]}")"; m="$(missing "${apple_api[@]}")"
              [ -z "$api" ] || [ -z "$m" ] || fail "App Store Connect API-key notarization is partly configured (set: $api); missing: $m"
              idp="$(present APPLE_ID APPLE_PASSWORD)"; m="$(missing "${apple_id[@]}")"
              [ -z "$idp" ] || [ -z "$m" ] || fail "Apple ID notarization is partly configured (set: $idp); missing: $m"
              if [ -n "$api" ]; then
                macos="api-key"
                [ -z "$idp" ] || echo "::notice::both notarization credentials are configured; using the App Store Connect API key, not the Apple ID"
              elif [ -n "$idp" ]; then
                macos="apple-id"
              else
                fail "macOS signing needs notarization credentials too: APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8 (recommended), or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID"
              fi
            fi
            ats=(AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_CERTIFICATE_PROFILE)
            pfx=(WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD)
            any_ats="$(present "${ats[@]}" AZURE_CLIENT_SECRET)"; any_pfx="$(present "${pfx[@]}")"
            if [ -n "$any_ats" ]; then
              m="$(missing "${ats[@]}")"; [ -z "$m" ] || fail "Azure Artifact Signing is partly configured (set: $any_ats); missing: $m"
              if [ "$HAS_AZURE_CLIENT_SECRET" = "true" ]; then windows="artifact-signing-secret"; else windows="artifact-signing-oidc"; fi
              [ -z "$any_pfx" ] || echo "::notice::both Windows routes are configured; using Azure Artifact Signing, not the .pfx"
            elif [ -n "$any_pfx" ]; then
              m="$(missing "${pfx[@]}")"; [ -z "$m" ] || fail "Windows .pfx signing is partly configured (set: $any_pfx); missing: $m"
              windows=pfx
            fi
            echo "Signing routes: macOS $macos, Windows $windows, Linux none (no platform code signing)."
          fi
          # Only this runner's platform route takes effect here.
          route=none
          case "$RUNNER_OS" in
            macOS) route="$macos" ;;
            Windows) route="$windows" ;;
          esac
          [ "$route" = "none" ] && [ -n "$TAG" ] && [ "$RUNNER_OS" != "Linux" ] && echo "::notice::no $RUNNER_OS signing credentials configured; $TARGET builds unsigned"
          { echo "route=$route"; echo "macos=$([ "$RUNNER_OS" = macOS ] && echo "$macos" || echo none)"; echo "windows=$([ "$RUNNER_OS" = Windows ] && echo "$windows" || echo none)"; } >> "$GITHUB_OUTPUT"

      - name: Build desktop app (release profile, default features — no e2e; no signing credentials)
        shell: bash
        working-directory: apps/desktop
        env:
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
        run: |
          # Compiling (build scripts, proc macros, beforeBuildCommand) runs with
          # no signing key or certificate present; only the bundle step below
          # gets them (defense in depth: both share this runner).
          args=(build --ci --target "$TARGET" --no-bundle)
          if [ -n "${UPDATER_CONFIG:-}" ]; then args+=(--config "$UPDATER_CONFIG"); fi
          npx tauri "${args[@]}"

      - name: Import Windows signing certificate (.pfx route, tagged release only)
        id: wincert
        if: runner.os == 'Windows' && needs.preflight.outputs.tag != '' && steps.route.outputs.windows == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "anvil-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            # A PFX with a chain imports several certificates: record them all for removal first.
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw)
            "thumbprints=$(($imported | ForEach-Object Thumbprint) -join ' ')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          $cert = $imported | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $cert) { throw "the Windows signing PFX holds no certificate with a private key" }
          $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Compress -Depth 5
          "config=$cfg" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # Azure Artifact Signing (formerly Trusted Signing): SignTool with
      # Microsoft's Artifact Signing dlib, set as Tauri's
      # bundle.windows.signCommand, so Tauri signs the app binary, the WiX and
      # NSIS helpers, the uninstaller and both installers as it bundles them.
      # Microsoft's setup: https://learn.microsoft.com/azure/artifact-signing/how-to-signing-integrations
      - name: Azure login for Artifact Signing (OIDC route, tagged release only)
        if: runner.os == 'Windows' && needs.preflight.outputs.tag != '' && steps.route.outputs.windows == 'artifact-signing-oidc'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ vars.AZURE_SUBSCRIPTION_ID == '' }}

      - name: Artifact Signing sign command (tagged release only)
        id: winats
        if: runner.os == 'Windows' && needs.preflight.outputs.tag != '' && startsWith(steps.route.outputs.windows, 'artifact-signing')
        shell: pwsh
        env:
          ROUTE: ${{ steps.route.outputs.windows }}
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          # Microsoft.ArtifactSigning.Client on nuget.org: version and the
          # registry's own SHA-512 package hash (catalog `packageHash`).
          DLIB_VERSION: "1.0.151"
          DLIB_SHA512: "BvPApD/Bxbzj2uf8qBYJ0wPoZYvAySHfrsIMZ2JkMQXy7NdTbQ81Gs71A0n/tOYOIWk3xpKY3YVZ1VtH0jcZhQ=="
        run: |
          $ErrorActionPreference = "Stop"
          # Only an Artifact Signing regional endpoint, and plain resource names.
          if ($env:ENDPOINT -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?$') { throw "ARTIFACT_SIGNING_ENDPOINT must be a regional https://<region>.codesigning.azure.net endpoint" }
          if ($env:ACCOUNT -notmatch '^[A-Za-z0-9-]{3,64}$') { throw "ARTIFACT_SIGNING_ACCOUNT is not an account name" }
          if ($env:CERTIFICATE_PROFILE -notmatch '^[A-Za-z0-9-]{3,64}$') { throw "ARTIFACT_SIGNING_CERTIFICATE_PROFILE is not a certificate profile name" }

          # SignTool from the newest installed Windows SDK; the dlib needs
          # 10.0.22621 or later (Microsoft: the 20348 SDK is not supported).
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $kits -Directory |
            Where-Object { $_.Name -match '^10\.0\.(\d+)\.\d+$' -and [int]$Matches[1] -ge 22621 -and (Test-Path (Join-Path $_.FullName "x64\signtool.exe")) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" }
          if (-not $signtool) { throw "no x64 signtool.exe from Windows SDK 10.0.22621 or later under $kits" }
          Write-Host "SignTool: $signtool"

          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pkg = Join-Path $dir "client.zip"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$($env:DLIB_VERSION)/microsoft.artifactsigning.client.$($env:DLIB_VERSION).nupkg"
          Invoke-WebRequest -Uri $url -OutFile $pkg -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($pkg)))
          if ($sha -ne $env:DLIB_SHA512) { throw "Microsoft.ArtifactSigning.Client $($env:DLIB_VERSION) does not match its pinned SHA-512" }
          Expand-Archive -Path $pkg -DestinationPath (Join-Path $dir "client") -Force
          $dlib = Join-Path $dir "client\bin\x64\Azure.CodeSigning.Dlib.dll"
          $sig = Get-AuthenticodeSignature -LiteralPath $dlib
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "Azure.CodeSigning.Dlib.dll is not validly signed by Microsoft ($($sig.Status))" }

          # DefaultAzureCredential, limited to the one credential this route
          # uses: the Azure CLI session from azure/login (OIDC), or
          # AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET in the
          # bundle step's environment (EnvironmentCredential).
          $exclude = @("ManagedIdentityCredential", "WorkloadIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          if ($env:ROUTE -eq "artifact-signing-secret") { $exclude += "AzureCliCredential" }
          $metadata = Join-Path $dir "metadata.json"
          @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:CERTIFICATE_PROFILE; CorrelationId = "ferrum-anvil-$($env:GITHUB_RUN_ID)-$($env:TARGET)"; ExcludeCredentials = $exclude } |
            ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 -LiteralPath $metadata

          # Tauri replaces "%1" with each file it signs (object notation keeps
          # the spaces in the SignTool path and the description).
          $cfg = Join-Path $env:RUNNER_TEMP "anvil-artifact-signing.conf.json"
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = $signtool; args = @("sign", "/v", "/fd", "SHA256", "/tr", "http://timestamp.acs.microsoft.com", "/td", "SHA256", "/d", "Ferrum Anvil", "/dlib", $dlib, "/dmdf", $metadata, "%1") } } } } |
            ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 -LiteralPath $cfg
          "config=$cfg" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Bundle and sign
        shell: bash
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_P8: ${{ needs.preflight.outputs.tag != '' && secrets.APPLE_API_KEY_P8 || '' }}
          MACOS_ROUTE: ${{ steps.route.outputs.macos }}
          # Artifact Signing with a client secret (EnvironmentCredential).
          AZURE_TENANT_ID: ${{ steps.route.outputs.windows == 'artifact-signing-secret' && vars.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.route.outputs.windows == 'artifact-signing-secret' && vars.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.route.outputs.windows == 'artifact-signing-secret' && secrets.AZURE_CLIENT_SECRET || '' }}
          WIN_SIGN_CONFIG: ${{ steps.wincert.outputs.config || steps.winats.outputs.config }}
          UPDATER_CONFIG: ${{ steps.updater.outputs.config }}
          # Only a tagged release (in the `release` environment) receives any
          # signing credential; a dry run is always unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.preflight.outputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.preflight.outputs.tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          BUNDLES: ${{ matrix.bundles }}
          # The AppImage leaves libwayland-client to the host, like libEGL and
          # the rest of the graphics stack (AppImageCommunity excludelist; Mesa
          # loads its EGL driver against the host's copy). Read by linuxdeploy.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: libwayland-client.so*
        run: |
          # macOS: only the selected route's credentials reach Tauri (its
          # bundler prefers APPLE_ID over APPLE_API_KEY when both are set).
          case "${MACOS_ROUTE:-none}" in
            api-key)
              unset APPLE_ID APPLE_PASSWORD
              [[ "$APPLE_API_KEY" =~ ^[A-Z0-9]{8,16}$ ]] || { echo "::error::APPLE_API_KEY must be the App Store Connect key ID (letters and digits), not the key itself"; exit 1; }
              keydir="$RUNNER_TEMP/anvil-asc-key"
              (umask 077 && mkdir -p "$keydir" && printf '%s\n' "$APPLE_API_KEY_P8" > "$keydir/AuthKey_$APPLE_API_KEY.p8")
              export APPLE_API_KEY_PATH="$keydir/AuthKey_$APPLE_API_KEY.p8"
              grep -q -- '-----BEGIN PRIVATE KEY-----' "$APPLE_API_KEY_PATH" || { rm -rf "$keydir"; echo "::error::APPLE_API_KEY_P8 must hold the contents of the AuthKey_<key id>.p8 file"; exit 1; }
              trap 'rm -rf "$keydir"' EXIT ;;
            apple-id) unset APPLE_API_ISSUER APPLE_API_KEY ;;
            *) unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY ;;
          esac
          unset APPLE_API_KEY_P8
          # Unset empty credentials so Tauri never attempts a half-configured signing.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || unset "$v"
          done
          if [ -z "${UPDATER_CONFIG:-}" ]; then unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          # The same --config values as the build (Tauri merges them in order).
          args=(bundle --ci --target "$TARGET" --bundles "$BUNDLES")
          if [ -n "${WIN_SIGN_CONFIG:-}" ]; then args+=(--config "$WIN_SIGN_CONFIG"); fi
          if [ -n "${UPDATER_CONFIG:-}" ]; then args+=(--config "$UPDATER_CONFIG"); fi
          npx tauri "${args[@]}"

      - name: Remove Windows signing certificates
        if: always() && steps.wincert.outputs.thumbprints != ''
        shell: pwsh
        env:
          THUMBPRINTS: ${{ steps.wincert.outputs.thumbprints }}
        run: |
          foreach ($t in $env:THUMBPRINTS -split ' ' | Where-Object { $_ }) {
            $c = Get-Item -Path "Cert:\CurrentUser\My\$t" -ErrorAction SilentlyContinue
            if ($c -and $c.HasPrivateKey) { Remove-Item -Path $c.PSPath -DeleteKey } elseif ($c) { Remove-Item -Path $c.PSPath }
          }

      - name: AppImage leaves libwayland-client to the host (Linux)
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          images=(target/"$TARGET"/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -gt 0 ] || { echo "::error::no AppImage was bundled"; exit 1; }
          for a in "${images[@]}"; do
            # The release checker's trusted listing: its ELF/SquashFS offset
            # reader and unsquashfs >= 4.5.1; the AppImage is never run.
            listing="$(scripts/release-check.sh --list-appimage "$a")" || { echo "::error::could not list $a"; exit 1; }
            if grep -E '(^|/)libwayland-client\.so' <<<"$listing"; then
              echo "::error::$(basename "$a") bundles libwayland-client; the host's Mesa EGL cannot load against an older copy (WebKit aborts with EGL_BAD_PARAMETER)"
              exit 1
            fi
            echo "ok: $(basename "$a") bundles no libwayland-client ($(grep -c . <<<"$listing") files)"
          done

      - name: Build CLI
        shell: bash
        env:
          # Same floor as the desktop bundle (minimumSystemVersion 11.0): linked-file
          # reads rely on O_NOFOLLOW_ANY, which older macOS kernels lack. rustc reads
          # this only for Apple targets.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --locked --release -p anvil-cli --target "$TARGET"

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          out="dist/$TARGET"
          mkdir -p "$out"
          b="target/$TARGET/release/bundle"
          shopt -s nullglob
          for f in "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage "$b"/msi/*.msi "$b"/nsis/*-setup.exe \
                   "$b"/appimage/*.AppImage.sig "$b"/msi/*.msi.sig "$b"/nsis/*-setup.exe.sig; do
            name="$(basename "$f" | tr ' ' '-')"
            cp "$f" "$out/$name"
          done
          # Updater archives (only with the updater key). Both macOS targets
          # produce "<Product>.app.tar.gz"; name them like the DMGs.
          for f in "$b"/macos/*.app.tar.gz; do
            [ -f "$f.sig" ] || { echo "::error::$f has no updater signature"; exit 1; }
            arch="${TARGET%%-*}"; [ "$arch" = "x86_64" ] && arch=x64
            name="$(basename "$f" .app.tar.gz | tr ' ' '-')_${VERSION}_${arch}.app.tar.gz"
            cp "$f" "$out/$name"
            cp "$f.sig" "$out/$name.sig"
          done
          stage="$RUNNER_TEMP/anvil-cli-$VERSION-$TARGET"
          mkdir -p "$stage"
          cp LICENSE LICENSE-COMMERCIAL.md THIRD_PARTY_LICENSES.md "$stage/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/anvil.exe" "$stage/"
            (cd "$RUNNER_TEMP" && 7z a -tzip -bso0 "anvil-cli-$VERSION-$TARGET.zip" "anvil-cli-$VERSION-$TARGET")
            mv "$RUNNER_TEMP/anvil-cli-$VERSION-$TARGET.zip" "$out/"
            echo "app=target/$TARGET/release/anvil-desktop.exe" >> "$GITHUB_OUTPUT"
          else
            cp "target/$TARGET/release/anvil" "$stage/"
            tar -C "$RUNNER_TEMP" -czf "$out/anvil-cli-$VERSION-$TARGET.tar.gz" "anvil-cli-$VERSION-$TARGET"
            echo "app=target/$TARGET/release/anvil-desktop" >> "$GITHUB_OUTPUT"
          fi
          ls -la "$out"

      - name: Release check (no WebDriver server, no test hooks)
        shell: bash
        env:
          APP: ${{ steps.collect.outputs.app }}
          PROBE: ${{ matrix.probe }}
        run: |
          out="dist/$TARGET"
          args=(--report "$out/release-check-$VERSION-$TARGET.json")
          [ "$PROBE" = "true" ] && args+=(--runtime-probe)
          shopt -s nullglob
          files=("$out"/*.dmg "$out"/*.deb "$out"/*.rpm "$out"/*.AppImage "$out"/*.msi "$out"/*-setup.exe "$out"/*.app.tar.gz "$out"/anvil-cli-* "$APP")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a scripts/release-check.sh "${args[@]}" "${files[@]}"
          else
            scripts/release-check.sh "${args[@]}" "${files[@]}"
          fi

      - name: Verify signatures (records signed only if verified; fails if configured signing did not verify)
        id: signing
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
          UPDATER: ${{ steps.updater.outputs.updater }}
          UPDATER_PUBKEY: ${{ steps.updater.outputs.pubkey }}
          APP: ${{ steps.collect.outputs.app }}
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          out="dist/$TARGET"
          # Evidence that the updater public key is compiled into the app binary.
          if [ "$UPDATER" = "true" ]; then
            [ -n "$UPDATER_PUBKEY" ] || { echo "::error::updater configured without a public key"; exit 1; }
            LC_ALL=C grep -aqF "$UPDATER_PUBKEY" "$APP" || { echo "::error::the updater public key is not in $APP"; exit 1; }
          fi
          signed=false; applicable=true; notarized=false; method="none"; detail="unsigned — owner credentials not configured"
          case "$RUNNER_OS" in
            macOS)
              app="$(find "target/$TARGET/release/bundle/macos" -maxdepth 1 -name "*.app" | head -1)"
              info="$(codesign -dv --verbose=2 "$app" 2>&1 || true)"
              if codesign --verify --deep --strict "$app" 2>/dev/null && ! grep -q "Signature=adhoc" <<<"$info" && grep -q "^TeamIdentifier=[A-Z0-9]" <<<"$info"; then
                signed=true; method="Developer ID codesign"
                detail="$(grep -E '^(Authority|TeamIdentifier)=' <<<"$info" | head -2 | tr '\n' ' ')"
                dmg="$(find "$out" -maxdepth 1 -name "*.dmg" | head -1)"
                # Tauri notarizes and staples the .app; the DMG is built from it.
                if xcrun stapler validate "$app" >/dev/null 2>&1 || xcrun stapler validate "$dmg" >/dev/null 2>&1 || spctl -a -t exec -vv "$app" 2>&1 | grep -q "Notarized Developer ID"; then
                  notarized=true; method="$method + notarized"
                else
                  method="$method (not notarized)"
                fi
              elif grep -q "Signature=adhoc" <<<"$info"; then
                detail="unsigned — owner credentials not configured (ad-hoc signature only, not a Developer ID)"
              fi ;;
            Windows)
              # Every MSI and NSIS installer must be Valid. (Tauri restores the
              # unsigned app binary in target/ after bundling; the signed copy
              # is inside the installers.)
              IFS=$'\t' read -r status subject < <(pwsh -NoProfile -File scripts/authenticode-status.ps1 -Dir "$out") || true
              subject="${subject%$'\r'}"
              if [ "$status" = "Valid" ]; then signed=true; method="Authenticode"; detail="all installers: Valid; signer: $subject"; fi ;;
            Linux)
              applicable=false
              detail="unsigned — owner credentials not configured (no platform code signing for .deb/.rpm/.AppImage; verify with SHA256SUMS)" ;;
          esac
          if [ "$signed" = "true" ]; then
            case "$ROUTE" in
              api-key) method="$method (App Store Connect API key)" ;;
              apple-id) method="$method (Apple ID)" ;;
              pfx) method="$method (imported .pfx certificate)" ;;
              artifact-signing-*) method="$method (Azure Artifact Signing)" ;;
            esac
          fi
          echo "route=$ROUTE signed=$signed method=$method detail=$detail"
          # Credentials were configured for this platform: anything less than
          # a verified (and, on macOS, notarized) signature fails the release.
          if [ "${ROUTE:-none}" != "none" ]; then
            [ "$signed" = "true" ] || { echo "::error::signing is configured for $RUNNER_OS (route $ROUTE) but $TARGET is not signed: $detail"; exit 1; }
            if [ "$RUNNER_OS" = "macOS" ] && [ "$notarized" != "true" ]; then
              echo "::error::$TARGET is Developer ID signed but not notarized (route $ROUTE); refusing to record or ship it"; exit 1
            fi
          fi
          # shellcheck disable=SC2016 # JavaScript source, not shell
          node -e '
            const [target, os, arch, runner, signed, method, detail, updater, pubkey, applicable, route] = process.argv.slice(1);
            const { execSync } = require("node:child_process");
            const v = (c) => { try { return execSync(c, { encoding: "utf8" }).trim(); } catch { return null; } };
            const info = {
              target, os, arch, runner,
              toolchain: { rustc: v("rustc -V"), cargo: v("cargo -V"), node: process.version, tauri_cli: v("node apps/desktop/node_modules/@tauri-apps/cli/tauri.js -V") },
              signing: { signed: signed === "true", applicable: applicable === "true", route, method, detail },
              // Built with the owner updater key: the public key compiled into the
              // app (found in the binary above), which the publish job verifies
              // every signature against.
              updater: updater === "true" ? { configured: true, pubkey, embedded: true } : { configured: false },
            };
            require("node:fs").writeFileSync(`dist/${target}/build-info.json`, JSON.stringify(info, null, 2) + "\n");
          ' "$TARGET" "$RUNNER_OS" "${TARGET%%-*}" "$RUNNER_LABEL" "$signed" "$method" "$detail" "$UPDATER" "$UPDATER_PUBKEY" "$applicable" "${ROUTE:-none}"

      - name: CycloneDX SBOMs (Rust, per target)
        shell: bash
        run: |
          cargo cyclonedx -f json --spec-version 1.5 --target "$TARGET" -q
          cp apps/desktop/src-tauri/anvil-desktop.cdx.json "dist/$TARGET/anvil-desktop-$VERSION-$TARGET.cdx.json"
          cp crates/anvil-cli/anvil-cli.cdx.json "dist/$TARGET/anvil-cli-$VERSION-$TARGET.cdx.json"
          if grep -q "tauri-plugin-wdio-webdriver" "dist/$TARGET/anvil-desktop-$VERSION-$TARGET.cdx.json"; then
            echo "::error::desktop SBOM lists the test-only WebDriver plugin"; exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Assemble release evidence
    needs: [preflight, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # list the CI/E2E/lab runs for this commit
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
      - name: Checked out the preflight commit
        shell: bash
        env:
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: '[ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "::error::HEAD $(git rev-parse HEAD) is not the preflight commit $COMMIT"; exit 1; }'
      - uses: ./.github/actions/setup
        with:
          tauri-deps: "false"
          cache-key: release-publish
          # A failed release run never writes the build cache.
          cache-on-failure: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
      - name: npm SBOM (UI production dependencies)
        working-directory: apps/desktop
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --spec-version 1.5 --output-reproducible --output-file "../../dist/anvil-desktop-ui-npm-$VERSION.cdx.json"
      - name: License report
        run: node scripts/licenses.mjs --check --json dist/license-report.json
      - name: Test runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_COMMIT&per_page=100" \
            --jq '[.workflow_runs[] | {workflow: .name, run_id: .id, event: .event, status: .status, conclusion: .conclusion, url: .html_url}]' > "$RUNNER_TEMP/runs.json"
          cat "$RUNNER_TEMP/runs.json"
      - name: Updater manifest (only with signed updater artifacts)
        run: node scripts/updater-manifest.mjs --dist dist --repo "$GITHUB_REPOSITORY" --tag "${TAG:-anvil-v$VERSION}" --version "$VERSION"
      - name: Checksums and release evidence
        run: |
          args=(--dist dist --test-runs "$RUNNER_TEMP/runs.json")
          [ -n "$TAG" ] && args+=(--tag "$TAG")
          node scripts/release-evidence.mjs "${args[@]}"
      - name: Release notes (the published body, from CHANGELOG.md and the evidence)
        run: |
          args=(--version "$VERSION" --evidence dist/release-evidence.json --out "$RUNNER_TEMP/release-notes/notes.md")
          [ -n "$TAG" ] && args+=(--tag "$TAG")
          node scripts/release-notes.mjs "${args[@]}"
          cat "$RUNNER_TEMP/release-notes/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Flatten release assets
        run: |
          mkdir -p upload
          find dist -type f ! -name build-info.json -exec cp {} upload/ \;
          ls -la upload
          (cd upload && sha256sum -c SHA256SUMS)
      - name: Upload evidence bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ needs.preflight.outputs.version }}
          path: upload/
          retention-days: 90
      # Kept apart from the evidence bundle so the notes never become a release
      # asset, and named outside the release-* pattern the build download uses.
      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/release-notes/notes.md
          if-no-files-found: error
          retention-days: 90

  # The website's tests at a pinned ferrumedge commit (failure-matrix
  # REL-006/007/008), re-run on every release run. It runs beside the build
  # and never gates the draft release: a failure (or a missing
  # FERRUMEDGE_READ_TOKEN, which fails the job rather than skipping it) shows
  # in the run without blocking publishing.
  website:
    name: Website evidence
    needs: preflight
    permissions: {}
    uses: ./.github/workflows/website-evidence.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
    secrets:
      FERRUMEDGE_READ_TOKEN: ${{ secrets.FERRUMEDGE_READ_TOKEN }}

  release:
    name: Create draft release
    if: needs.preflight.outputs.tag != ''
    needs: [preflight, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      # Draft-only text, as a case-insensitive ERE: DRAFT_TEXT in
      # scripts/release-notes.mjs (a test keeps the two equal).
      DRAFT_TEXT: "draft release of|this draft is not published|review the evidence .* before publishing"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ needs.preflight.outputs.version }}
          path: upload/
      - name: Verify evidence bundle
        run: (cd upload && sha256sum -c SHA256SUMS)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes-${{ needs.preflight.outputs.version }}
          path: notes/
      # Fail closed: the body is published as-is, so it must be the generated
      # notes and carry no draft-only text (#356).
      - name: Check release notes
        run: |
          notes=notes/notes.md
          [ -f "$notes" ] && [ ! -L "$notes" ] || { echo "::error::release notes must be a regular file"; exit 1; }
          [ -s "$notes" ] && [ "$(wc -c < "$notes")" -le 100000 ] || { echo "::error::release notes are empty or too large"; exit 1; }
          if grep -inE "$DRAFT_TEXT" "$notes"; then
            echo "::error::release notes contain draft-only text"; exit 1
          fi
          grep -qF "Built from \`$RELEASE_COMMIT\`" "$notes" || { echo "::error::release notes are not for $RELEASE_COMMIT"; exit 1; }
          # The notes' first lines state the installers' signing status; it must
          # agree with release-evidence.json from the same publish job (a
          # consistency check: SHA256SUMS does not cover that file).
          first="$(head -n 1 "$notes")"
          case "$(jq -r '.signed | if type == "boolean" then tostring else "invalid" end' upload/release-evidence.json)" in
            true) [[ "$first" == '**Signing:** '* ]] ;;
            false) [ "$first" = '> [!WARNING]' ] && [[ "$(sed -n 2p "$notes")" == '> **Unsigned installers.** '* ]] ;;
            *) false ;;
          esac || { echo "::error::the release notes' signing status does not match release-evidence.json"; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" upload/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "Ferrum Anvil $VERSION" --notes-file notes/notes.md
      - name: Draft body is the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,isDraft > "$RUNNER_TEMP/release.json"
          [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = "true" ] || { echo "::error::$TAG is not a draft"; exit 1; }
          jq -r .body "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/body.md"
          if grep -inE "$DRAFT_TEXT" "$RUNNER_TEMP/body.md"; then
            echo "::error::the draft body contains draft-only text"; exit 1
          fi
          grep -qF "Built from \`$RELEASE_COMMIT\`" "$RUNNER_TEMP/body.md" || { echo "::error::the draft body is not the release notes"; exit 1; }
          # Draft-only reminders go to the run summary, never into the release body.
          {
            echo "Draft release $TAG of Ferrum Anvil $VERSION created from \`$RELEASE_COMMIT\`. It is not published."
            echo
            echo "Its body is the final release notes (below). Review the evidence and the owner checklist in docs/release.md before publishing."
            echo
            cat notes/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
